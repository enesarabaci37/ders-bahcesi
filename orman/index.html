<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orman Dostları">
<meta name="theme-color" content="#2f5f34">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Orman Dostları</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Orman Dostları: tam ekran canvas sahne + üstte HUD, altta ahşap raf (sepet), oyun panelleri üstte açılır kartlar.
   Tek bir oyun dünyası görünümü (açık/koyu tema yok), bütün renkler burada tanımlı. */
:root{
  --wood:#6b4426; --wood2:#8a5a33; --woodhi:#a8743f;
  --paper:#fffaf0; --paper2:#f3ead6;
  --ink:#24361f; --muted:#5f6f55;
  --leaf:#3f9a46; --leaf2:#2c7a35;
  --sun:#ffc23c; --sun2:#e09a0e;
  --coral:#ff6b57; --ok:#22a866; --no:#e5484d;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --gx:max(12px,env(safe-area-inset-left,0px)); --gxr:max(12px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2f5f34;color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:var(--gx);padding-right:var(--gxr)}
#hud>*{pointer-events:auto}
.rbtn{width:50px;height:50px;border-radius:16px;background:rgba(255,250,240,.94);display:grid;place-items:center;font-size:24px;
  box-shadow:0 4px 0 rgba(40,30,10,.25);flex:none;font-family:var(--display);font-weight:800;color:var(--wood)}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,30,10,.25)}
.rbtn.off{opacity:.6}
.rbadge{background:rgba(255,250,240,.94);border-radius:18px;padding:6px 14px 8px;box-shadow:0 4px 0 rgba(40,30,10,.25);min-width:0;max-width:340px;flex:1 1 auto}
.rbadge b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;color:var(--leaf2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rprog{height:9px;border-radius:9px;background:#e4dcc6;overflow:hidden;margin-top:3px}
.rprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8aa0,#ff5a7a);border-radius:9px;transition:width .6s}
.rbadge small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sp{flex:1}

/* ---------- konuşma balonu ---------- */
#dlg{position:fixed;z-index:25;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  width:min(560px,calc(100% - 24px));display:flex;gap:10px;align-items:center;background:var(--paper);border-radius:22px;padding:10px 14px 10px 10px;
  box-shadow:0 6px 0 rgba(40,30,10,.22);transition:opacity .25s,transform .25s}
#dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dlg img{width:62px;height:62px;border-radius:50%;background:#e9f3e0;flex:none;object-fit:contain;border:3px solid #fff;box-shadow:0 0 0 2px #cfe3c4}
#dlg .dt{min-width:0;flex:1}
#dlg .dn{font-family:var(--display);font-size:15px;color:var(--leaf2);line-height:1}
#dlg p{margin:2px 0 0;font-size:18px;line-height:1.3;color:var(--ink);text-wrap:pretty}
#dlg .tap{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- alt raf ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:12px var(--gxr) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gx);
  background:linear-gradient(180deg,var(--woodhi) 0,var(--wood2) 10px,var(--wood) 100%);border-top:3px solid #c08a52;
  box-shadow:0 -6px 18px rgba(0,0,0,.18);border-radius:22px 22px 0 0}
#dock:before{content:"";position:absolute;inset:6px 0 auto 0;height:2px;background:rgba(255,255,255,.12)}
.dbtn{width:66px;height:72px;border-radius:18px;background:rgba(255,250,240,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(0,0,0,.28);gap:0}
.dbtn .di{font-size:30px;line-height:1}
.dbtn .dl{font-size:12px;color:var(--wood);font-family:var(--display)}
.dbtn:active,.qbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.inv{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;min-width:0;scrollbar-width:none}
.inv::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;width:68px;height:68px;border-radius:18px;background:#fff7e6;display:grid;place-items:center;
  box-shadow:inset 0 -5px 0 #e9d6b2,0 3px 0 rgba(0,0,0,.25);touch-action:none;transition:transform .15s}
.chip .fi{font-size:38px;line-height:1;pointer-events:none}
.chip svg.fi{width:42px;height:42px}
.chip .cnt{position:absolute;top:-6px;right:-6px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--coral);color:#fff;
  font-family:var(--display);font-size:16px;line-height:26px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.chip.empty{opacity:.45}
.chip.empty .cnt{background:#9b8a70}
.chip.sel{transform:translateY(-8px);box-shadow:inset 0 -5px 0 #e9d6b2,0 0 0 4px var(--sun),0 8px 0 rgba(0,0,0,.25)}
.chip.want{animation:want 1s ease-in-out infinite}
.chip.bump{animation:bump .45s}
@keyframes want{50%{transform:translateY(-6px) scale(1.06);box-shadow:inset 0 -5px 0 #e9d6b2,0 0 0 5px rgba(255,194,60,.9),0 8px 0 rgba(0,0,0,.2)}}
@keyframes bump{40%{transform:scale(1.25)}}
.qbtn{display:flex;align-items:center;gap:10px;height:72px;padding:0 18px 0 12px;border-radius:20px;background:linear-gradient(180deg,#ffd45e,var(--sun));
  box-shadow:inset 0 -5px 0 var(--sun2),0 4px 0 rgba(0,0,0,.28);color:#4a2d00;text-align:left}
.qbtn .qi{font-size:36px;line-height:1}
.qbtn b{display:block;font-family:var(--display);font-size:20px;line-height:1.05}
.qbtn small{display:block;font-size:12px;opacity:.85}
.qbtn.want{animation:want2 1s ease-in-out infinite}
@keyframes want2{50%{transform:scale(1.06);box-shadow:inset 0 -5px 0 var(--sun2),0 0 0 6px rgba(255,255,255,.85),0 4px 0 rgba(0,0,0,.28)}}
@media (max-width:620px){
  #dock{grid-template-columns:auto 1fr;grid-template-areas:"inv inv" "map quiz";row-gap:10px}
  .inv{grid-area:inv} #mapBtn{grid-area:map} .qbtn{grid-area:quiz;justify-content:center}
  .dbtn{width:auto;height:60px;flex-direction:row;gap:6px;padding:0 14px}
  .qbtn{height:60px}
  .chip{width:60px;height:60px}.chip .fi{font-size:33px}.chip svg.fi{width:36px;height:36px}
}
#drag{position:fixed;left:0;top:0;z-index:90;pointer-events:none;font-size:58px;line-height:1;transform:translate(-50%,-70%);filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}
#drag svg{width:62px;height:62px}
.fly{position:fixed;z-index:85;pointer-events:none;font-size:46px;line-height:1;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s}
.fly svg{width:48px;height:48px}

/* ---------- paneller ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,32,18,.55);
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gxr) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gx);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{position:relative;background:var(--paper);border-radius:28px;width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:rise .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(180deg,#4fae55,var(--leaf2));color:#fff;border-radius:28px 28px 0 0;position:sticky;top:0;z-index:2}
.chead img{width:54px;height:54px;border-radius:50%;background:#e8f5df;border:3px solid #fff;object-fit:contain;flex:none}
.chead h2{margin:0;font-family:var(--display);font-size:24px;line-height:1;flex:1;min-width:0}
.chead h2 small{display:block;font-family:var(--body);font-size:13px;opacity:.9;margin-top:3px}
.x{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:26px;display:grid;place-items:center;flex:none}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.dots i.cur{background:var(--sun)}
.cbody{padding:18px 18px 22px}
.qtext{display:flex;gap:10px;align-items:flex-start;font-size:22px;line-height:1.35;margin:0 0 14px;text-wrap:pretty}
.qtext .qq{flex:1;min-width:0}
.say{flex:none;width:44px;height:44px;border-radius:50%;background:#e8f2df;font-size:20px;display:grid;place-items:center}
.vis{background:#f4efe1;border-radius:20px;padding:14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;min-height:80px}
.vis:empty{display:none}
.vis .it{font-size:38px;line-height:1;animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.vis .it svg{width:40px;height:40px;display:block}
.vis .row{display:flex;gap:4px;justify-content:center;width:100%}
.vis .bask{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;align-content:center;width:110px;min-height:84px;padding:8px 6px 14px;border-radius:14px 14px 40px 40px;
  background:linear-gradient(180deg,#d9a566,#b77c3e);box-shadow:inset 0 -6px 0 #94602c}
.vis .bask .it{font-size:24px}.vis .bask .it svg{width:26px;height:26px}
.vis .slot{width:56px;height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:32px;box-shadow:0 3px 0 #e2d8bf}
.vis .slot.q{background:#fff3d4;border:3px dashed var(--sun2);font-family:var(--display);color:var(--sun2);font-size:30px}
.vis .slot.num{font-family:var(--display);font-size:26px;width:auto;min-width:56px;padding:0 8px}
.vis .plus{font-family:var(--display);font-size:36px;color:var(--wood)}
.vis .story{font-size:44px}
.vis .cover{width:100%;text-align:center;font-family:var(--display);font-size:22px;color:var(--leaf2)}
.timer{height:8px;border-radius:8px;background:#e4dcc6;overflow:hidden;width:100%}
.timer i{display:block;height:100%;background:var(--leaf);width:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.opt{min-height:86px;border-radius:20px;background:#fff;box-shadow:inset 0 -5px 0 #e6dcc4,0 3px 0 rgba(0,0,0,.12);font-family:var(--display);font-size:38px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.opt small{font-family:var(--body);font-size:15px;color:var(--muted)}
.opt img{width:64px;height:64px;object-fit:contain}
.opt svg{width:44px;height:44px}
.opt:active{transform:translateY(3px)}
.opt.ok{background:var(--ok);color:#fff;box-shadow:inset 0 -5px 0 #178a52;animation:pop .35s}
.opt.ok small{color:#e6fff1}
.opt.no{background:#ffe2e0;animation:shake .4s;opacity:.6}
.opt.done{background:#d9f3e4;color:var(--leaf2)}
@keyframes pop{from{transform:scale(.4)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:26px;margin-top:14px;text-align:center;font-size:18px;color:var(--leaf2)}
.fb.bad{color:#b2372e}
.reward{text-align:center;padding:24px 18px 26px}
.reward h2{font-family:var(--display);font-size:34px;margin:0;color:var(--leaf2)}
.reward p{margin:6px 0 16px;color:var(--muted);font-size:18px}
.rits{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.rits span{width:84px;height:84px;border-radius:22px;background:#fff7e6;display:grid;place-items:center;font-size:48px;box-shadow:inset 0 -5px 0 #e9d6b2;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.rits svg{width:52px;height:52px}
.big{display:block;width:100%;border-radius:20px;padding:14px;font-family:var(--display);font-size:24px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -5px 0 var(--sun2),0 4px 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(3px)}
.big.green{background:linear-gradient(180deg,#5cc062,var(--leaf));color:#fff;box-shadow:inset 0 -5px 0 var(--leaf2),0 4px 0 rgba(0,0,0,.2)}
.link{display:block;margin:10px auto 0;color:var(--muted);font-size:17px;padding:8px}

/* dost kartı & kutlama */
.friend{text-align:center;padding:22px 20px 24px}
.friend .tag{display:inline-block;background:var(--sun);color:#4a2d00;border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:16px}
.friend img{width:190px;height:170px;object-fit:contain;display:block;margin:6px auto 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.friend h2{font-family:var(--display);font-size:32px;margin:0;color:var(--ink)}
.friend .likes{color:var(--muted);font-size:17px;margin:2px 0 12px;display:flex;align-items:center;justify-content:center;gap:6px}
.friend .likes svg{width:24px;height:24px}
.fact{background:#eef6e6;border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.45;text-align:left;margin-bottom:18px}
.fact b{font-family:var(--display);color:var(--leaf2);display:block;font-size:16px}
.thumb{width:100%;aspect-ratio:16/9;border-radius:20px;display:block;background:#cfe3c4;margin:4px 0 16px;box-shadow:0 4px 0 rgba(0,0,0,.12)}

/* harita */
#map{position:fixed;inset:0;z-index:40;overflow-y:auto;background:linear-gradient(180deg,#bfe3f2 0%,#cfe9c8 40%,#a9d48f 100%);
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gxr) calc(env(safe-area-inset-bottom,0px) + 30px) var(--gx);animation:fade .3s}
.mtop{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto 6px}
.mtop h1{font-family:var(--display);font-size:clamp(30px,7vw,44px);margin:0;color:#24502b;line-height:1;flex:1}
.mtop h1 small{display:block;font-family:var(--body);font-size:15px;color:#4c6d48;margin-top:4px}
.trail{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:0}
.conn{height:46px;width:100%;display:block}
.conn path{fill:none;stroke:#fffaf0;stroke-width:7;stroke-linecap:round;stroke-dasharray:2 16}
.stop{width:min(440px,86%);background:var(--paper);border-radius:26px;padding:10px 10px 14px;box-shadow:0 6px 0 rgba(30,60,20,.22);text-align:left;position:relative}
.stop.l{align-self:flex-start}.stop.r{align-self:flex-end}
.stop canvas{width:100%;aspect-ratio:16/9;border-radius:18px;display:block;background:#d5e8c8}
.stop .sn{display:flex;align-items:center;gap:8px;padding:10px 6px 0}
.stop .sn b{font-family:var(--display);font-size:24px;line-height:1.05;flex:1;min-width:0}
.stop .sn small{display:block;font-family:var(--body);font-size:14px;color:var(--muted)}
.badge{flex:none;border-radius:999px;padding:5px 12px;font-family:var(--display);font-size:15px;background:#e7f4de;color:var(--leaf2)}
.badge.here{background:var(--sun);color:#4a2d00;animation:want2 1.4s infinite}
.badge.lock{background:#e8e2d4;color:#7d735f}
.stop.locked canvas{filter:grayscale(.85) brightness(.9) blur(1.5px)}
.stop.locked{opacity:.92}
.stop .lockic{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(255,250,240,.95);display:grid;place-items:center;font-size:36px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.minis{display:flex;gap:4px;padding:6px 6px 0}
.minis img{width:44px;height:40px;object-fit:contain}
.minis img.no{filter:brightness(0) opacity(.18)}

/* albüm */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.acard{background:#fff;border-radius:20px;padding:10px;box-shadow:inset 0 -4px 0 #ece3cf;text-align:center}
.acard img{width:100%;height:110px;object-fit:contain}
.acard b{display:block;font-family:var(--display);font-size:19px;line-height:1.1}
.acard small{display:flex;justify-content:center;align-items:center;gap:4px;color:var(--muted);font-size:14px;min-height:22px}
.acard small svg{width:18px;height:18px}
.acard p{margin:6px 0 0;font-size:14px;line-height:1.35;text-align:left;color:#3d4c36}
.acard.lock img{filter:brightness(0) opacity(.16)}
.acard.lock b{color:#9a907c}
.rsec{font-family:var(--display);font-size:20px;color:var(--leaf2);margin:16px 0 8px}
.rsec:first-child{margin-top:0}

/* açılış */
#splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.0),rgba(10,30,10,.55));padding:24px}
#splash .logo{font-family:var(--display);font-weight:800;font-size:clamp(46px,12vw,92px);line-height:.92;color:#fffaf0;
  text-shadow:0 4px 0 #2c6b2f,0 8px 0 rgba(0,0,0,.25);letter-spacing:-1px}
#splash .logo span{display:block;color:var(--sun);font-size:.62em;letter-spacing:0}
#splash .trio{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:10px 0 18px}
#splash .trio img{width:min(30vw,170px);height:min(26vw,150px);object-fit:contain;animation:bob 2.4s ease-in-out infinite}
#splash .trio img:nth-child(2){animation-delay:.3s;width:min(34vw,190px);height:min(30vw,170px)}
#splash .trio img:nth-child(3){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
#splash .big{width:min(320px,80vw);margin:0 auto;font-size:30px}
#splash p{color:#fffaf0;font-size:16px;margin:14px 0 0;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#fade{position:fixed;inset:0;z-index:75;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="nutg" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#e0a566"/><stop offset=".55" stop-color="#a5612b"/><stop offset="1" stop-color="#5e3212"/></radialGradient>
  <symbol id="nut" viewBox="0 0 40 40"><path d="M20 4C26 8 33 16 33 25C33 32 27 37 20 37C13 37 7 32 7 25C7 16 14 8 20 4Z" fill="url(#nutg)"/><ellipse cx="20" cy="31.5" rx="10.5" ry="5.2" fill="#e6c595"/><path d="M14 13C12 17 11.5 21 12.5 25" stroke="#fff" stroke-opacity=".5" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M20 5l-1.6-3.6h3.2z" fill="#5e3212"/></symbol>
</defs></svg>

<canvas id="cv"></canvas>

<div id="hud">
  <button class="rbtn" id="homeBtn" aria-label="Ders Bahçesi'ne dön">‹</button>

/* ================= ses ================= */
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,dur=.15,type='sine',vol=.14,when=0,f2){
  if(MUTED||!AC)return;
  try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}
}
let NB=null;
function noise(dur=.07,vol=.18,when=0,freq=1800){
  if(MUTED||!AC)return;
  try{if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+when;s.buffer=NB;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02)}catch(e){}
}
const sfx={
  tap:()=>tone(560,.07,'triangle',.08),
  pick:()=>tone(700,.09,'sine',.1,0,980),
  good:()=>{tone(660,.12,'sine',.13);tone(990,.18,'sine',.13,.1)},
  bad:()=>tone(220,.22,'triangle',.09,0,160),
  crunch:()=>{for(let i=0;i<4;i++)noise(.06,.16,i*.17,1400+rnd(900))},
  no:()=>{tone(330,.12,'sine',.1);tone(260,.16,'sine',.1,.13)},
  pop:()=>tone(420,.08,'sine',.12,0,820),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.26,'triangle',.13,i*.12)),
  heart:()=>{tone(880,.1,'sine',.08);tone(1320,.14,'sine',.07,.08)},
  chirp:()=>{const b=2400+rnd(900);for(let i=0;i<ri(2,4);i++)tone(b,.07,'sine',.035,i*.11,b*1.35)},
  croak:()=>{tone(110,.16,'square',.025,0,85);tone(105,.14,'square',.02,.2,80)}
};
/* sesli okuma */
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
let TRV=null;
function pickVoice(){if(!TTS)return;try{const vs=speechSynthesis.getVoices()||[],c=vs.filter(v=>/^tr(-|_|$)/i.test(v.lang||''));TRV=c.find(v=>/enhanced|premium|geliştirilmiş/i.test(v.name))||c.find(v=>v.localService)||c[0]||null}catch(e){}}
if(TTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
const clean=t=>String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,' ').replace(/ \+ /g,' artı ').replace(/ − /g,' eksi ').replace(/\s+/g,' ').trim();
function speak(t){if(!TTS||MUTED)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(t));u.lang='tr-TR';if(TRV)u.voice=TRV;u.rate=.95;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{TTS&&speechSynthesis.cancel()}catch(e){}}

/* ================= yiyecek çizimleri ================= */
const NUTP=typeof Path2D!=='undefined'?new Path2D('M20 4C26 8 33 16 33 25C33 32 27 37 20 37C13 37 7 32 7 25C7 16 14 8 20 4Z'):null;
function foodHTML(f,cls='fi'){return f==='findik'?`<svg class="${cls}" viewBox="0 0 40 40"><use href="#nut"/></svg>`:`<span class="${cls}">${FOODS[f].e}</span>`}
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function drawFood(c,f,x,y,s){
  if(s<=1)return;
  if(f==='findik'&&NUTP){c.save();c.translate(x-s/2,y-s/2);c.scale(s/40,s/40);
    const g=c.createRadialGradient(14,12,2,20,22,20);g.addColorStop(0,'#e0a566');g.addColorStop(.55,'#a5612b');g.addColorStop(1,'#5e3212');c.fillStyle=g;c.fill(NUTP);
    c.fillStyle='#e6c595';E(c,20,31.5,10.5,5.2);c.fill();c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=2.6;c.lineCap='round';c.beginPath();c.moveTo(14,13);c.quadraticCurveTo(11.5,19,12.5,25);c.stroke();c.restore();return}
  c.save();c.font=`${Math.round(s)}px ${EMOJI_FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(FOODS[f].e,x,y+s*.05);c.restore();
}

/* ================= hayvan çizimleri ================= */
function E(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,Math.abs(rx)),Math.max(.1,Math.abs(ry)),rot||0,0,TAU)}
function Gr(c,x,y,rx,ry,p){const r=Math.max(rx,ry),g=c.createRadialGradient(x-rx*.35,y-ry*.42,r*.05,x,y,r*1.12);g.addColorStop(0,p[0]);g.addColorStop(.55,p[1]);g.addColorStop(1,p[2]);return g}
function B(c,x,y,rx,ry,p,rot){c.fillStyle=Gr(c,x,y,rx,ry,p);E(c,x,y,rx,ry,rot);c.fill()}
function EYE(c,x,y,r,P){
  if(P.mood==='happy'||P.mood==='eat'){c.strokeStyle='#2b1a12';c.lineWidth=r*.42;c.lineCap='round';c.beginPath();c.arc(x,y+r*.35,r*.72,Math.PI*1.15,Math.PI*1.85);c.stroke();return}
  c.save();c.translate(x,y);c.scale(1,Math.max(.1,P.open));
  c.fillStyle='#1f140e';E(c,0,0,r,r*1.08);c.fill();
  c.fillStyle='#fff';E(c,r*.32,-r*.38,r*.36,r*.36);c.fill();E(c,-r*.3,r*.4,r*.15,r*.15);c.fill();
  c.restore();
  if(P.mood==='sad'){c.strokeStyle='rgba(45,28,18,.5)';c.lineWidth=r*.26;c.lineCap='round';c.beginPath();c.moveTo(x-r*.9,y-r*1.55);c.quadraticCurveTo(x,y-r*1.75,x+r*.75,y-r*1.95);c.stroke();
    c.fillStyle='rgba(140,200,255,.85)';E(c,x+r*.2,y+r*1.5,r*.28,r*.4);c.fill()}
}
function MOUTH(c,x,y,w,P){
  c.lineCap='round';c.strokeStyle='rgba(60,30,20,.85)';c.lineWidth=Math.max(1.1,w*.2);
  if(P.mood==='eat'){const o=Math.sin(P.t*16)*.5+.5;c.fillStyle='#6b2a24';E(c,x,y+w*.1,w*.42,w*(.12+o*.3));c.fill();return}
  c.beginPath();if(P.mood==='sad')c.arc(x,y+w*.5,w*.42,Math.PI*1.2,Math.PI*1.8);else c.arc(x,y-w*.2,w*.5,Math.PI*.15,Math.PI*.85);c.stroke();
}
function BLUSH(c,x,y,r){c.fillStyle='rgba(255,120,120,.28)';E(c,x,y,r,r*.65);c.fill()}
function WHISK(c,x,y,len,col){c.strokeStyle=col;c.lineWidth=.9;for(const a of[-.2,0,.22]){c.beginPath();c.moveTo(x,y);c.lineTo(x+len*Math.cos(a),y+len*Math.sin(a));c.stroke()}}
function leg(c,x,y0,w,ang,col,hoof){const len=-y0;c.save();c.translate(x,y0);c.rotate(ang);c.fillStyle=col;c.beginPath();c.moveTo(-w/2,0);c.lineTo(w/2,0);c.lineTo(w*.36,len);c.lineTo(-w*.36,len);c.closePath();c.fill();
  if(hoof){c.fillStyle=hoof;c.beginPath();c.moveTo(-w*.4,len-w*.75);c.lineTo(w*.4,len-w*.75);c.lineTo(w*.42,len);c.lineTo(-w*.42,len);c.fill()}c.restore()}
function legT(c,x,y0,w,ang,col){const len=-y0;c.save();c.translate(x,y0);c.rotate(ang);c.fillStyle=col;c.beginPath();
  if(c.roundRect)c.roundRect(-w/2,-w*.3,w,len+w*.3,w*.48);else c.rect(-w/2,-w*.3,w,len+w*.3);c.fill();c.restore()}
const PAL={

function dSquirrel(c,P){const p=PAL.sq,hop=P.moving?-Math.abs(Math.sin(P.walk*1.6))*12:0,br=Math.sin(P.t*2.4)*1.2;
  c.translate(0,hop);
  c.save();c.translate(-16,-18);c.rotate(Math.sin(P.t*1.7)*.07+(P.moving?Math.sin(P.walk*1.6)*.08:0));
  const tg=c.createLinearGradient(-50,-100,0,0);tg.addColorStop(0,p.f[0]);tg.addColorStop(.5,p.f[1]);tg.addColorStop(1,p.f[2]);

function ridge(c,W,H,y0,amp,cols,peaks,snow,rng){

    return y0-amp*v};
  const step=Math.max(3,W/160);
  c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+step;x+=step)c.lineTo(x,f(x));c.lineTo(W,H);c.closePath();
  const g=c.createLinearGradient(0,y0-amp,0,y0+amp*.2);g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);c.fillStyle=g;c.fill();

    c.restore()}
}

function buildScene(th,W,H,pr){

  const gg=c.createLinearGradient(0,gTop,0,H);gg.addColorStop(0,th.ground[0]);gg.addColorStop(.35,th.ground[1]);gg.addColorStop(1,th.ground[2]);c.fillStyle=gg;c.fill();
  if(th.lake){c.strokeStyle='rgba(230,215,170,.75)';c.lineWidth=u*.012;c.beginPath();for(let x=0;x<=W+W/90;x+=W/90){const y=gTop+Math.sin(x*.018+th.seed)*u*.006+Math.sin(x*.05)*u*.008;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
  if(th.path){const cx=W*.5,d=H-gTop;c.beginPath();c.moveTo(cx-W*.015,gTop+2);c.bezierCurveTo(cx+W*.06,gTop+d*.3,cx-W*.26,gTop+d*.6,cx-W*.2,H);c.lineTo(cx+W*.24,H);c.bezierCurveTo(cx+W*.02,gTop+d*.6,cx+W*.12,gTop+d*.3,cx+W*.02,gTop+2);c.closePath();
    const pg=c.createLinearGradient(0,gTop,0,H);pg.addColorStop(0,'rgba(200,170,120,.55)');pg.addColorStop(1,'rgba(176,136,90,.95)');c.fillStyle=pg;c.fill();
    for(let i=0;i<40;i++){const t=rng(),y=gTop+d*t,x=cx+(rng()-.5)*W*.2*t-W*.06*t;c.fillStyle='rgba(120,90,60,.35)';E(c,x,y,1+t*4,.6+t*2);c.fill()}}

    talk('sincap',`Merhaba! Ben Sincap Fıstık. ${R.name}'na hoş geldin!`);
    talk('tavsan','Ben de Tavşan Pamuk! Mışmış ile birlikte burada yaşıyoruz.');
    talk('sincap','Hepimizin karnı çok acıktı. Aşağıdaki sepetten fındığı sürükleyip bana verir misin?',{sticky:true,onShow:()=>{S.tut=1;persist();renderInv()}});
    return}
  talk(R.animals[0],`${R.name}'na hoş geldin! Biz burada yaşıyoruz.`);
  R.animals.forEach(k=>talk(k,`Ben ${ANIMALS[k].name}. En çok ${FOODS[ANIMALS[k].food].n} yemeyi severim!`));
  talk(R.animals[1],'Bilmece Ağacı\'ndaki soruları çöz, bize yiyecek getir. Hepimizle arkadaş olunca yeni bir yer açılacak!');
}
function greet(){const hungry=actors.filter(a=>a.st.hunger<40);
  if(hungry.length){const a=pick(hungry);talk(a.kind,`Tekrar hoş geldin! Karnım çok acıktı. Bana ${FOODS[ANIMALS[a.kind].food].n} getirir misin?`)}
  else talk(TH.animals[0],'Tekrar hoş geldin! Seni çok özledik.')}

/* ---------- harita ---------- */
function drawThumb(cv,i){
  const R=REGIONS[i],w=320,h=180,pr=cv.width/w,c=cv.getContext('2d');
  const sc=buildScene(R,w,h,pr);c.drawImage(sc.sky,0,0,cv.width,cv.height);c.drawImage(sc.land,0,0,cv.width,cv.height);
  c.save();c.scale(pr,pr);const gt=sc.gTop,yb=h-10,y0=gt+(yb-gt)*.35;
  R.animals.forEach((k,j)=>drawAnimalAt(c,k,w*(.25+j*.25),lerp(y0,yb,j%2?.5:.9),.5,idleP(),j===2?-1:1,R.shadow));c.restore();
}
function openMap(){
  ac();sfx.tap();hush();const m=$('#map');paused=true;
  let h=`<div class="mtop"><h1>Orman Haritası<small>Bir bölümdeki herkesle arkadaş olunca yeni yer açılır</small></h1><button class="rbtn" id="mClose" aria-label="Kapat">×</button></div><div class="trail">`;
  REGIONS.forEach((R,i)=>{const open=i<S.unlocked,here=i===S.region,done=S.done[i];
    const hearts=R.animals.reduce((s,k)=>s+Math.min(R.goal,(S.an[k]||{hearts:0}).hearts),0);
    if(i)h+=`<svg class="conn" viewBox="0 0 100 46" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="${i%2?'M28 0 C28 30, 72 16, 72 46':'M72 0 C72 30, 28 16, 28 46'}"/></svg>`;
    h+=`<button class="stop ${i%2?'r':'l'} ${open?'':'locked'}" data-i="${i}"><canvas width="640" height="360" data-t="${i}"></canvas>${open?'':'<span class="lockic">🔒</span>'}
      <span class="sn"><b>${R.name}<small>${open?`${hearts} / ${R.goal*R.animals.length} dostluk kalbi`:`${REGIONS[i-1].name} bölümünü bitirince açılır`}</small></b>
      <span class="badge ${here?'here':open?'':'lock'}">${here?'Buradasın':done?'Tamamlandı ✓':open?'Git':'Kilitli'}</span></span>
      <span class="minis">${R.animals.map(k=>`<img src="${portrait(k,120,108)}" class="${open&&S.an[k]&&S.an[k].friend?'':'no'}" alt="">`).join('')}</span></button>`});
  h+=`<svg class="conn" viewBox="0 0 100 46" preserveAspectRatio="none"><path vector-effect="non-scaling-stroke" d="M28 0 C28 30, 72 16, 72 46"/></svg>
    <div class="stop r locked"><canvas width="640" height="360" data-soon="1"></canvas><span class="lockic">❄️</span><span class="sn"><b>${SOON.name}<small>${SOON.desc}</small></b><span class="badge lock">Yakında</span></span></div></div>`;
  m.innerHTML=h;m.hidden=false;m.scrollTop=0;
  $('#mClose').onclick=()=>{sfx.tap();m.hidden=true;paused=false;last=performance.now()};
  m.querySelectorAll('.stop[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sfx.tap();
    if(i>=S.unlocked){toastMap(`${REGIONS[i-1].name} bölümündeki herkesle arkadaş olunca burası açılacak.`);return}
    if(i===S.region){m.hidden=true;paused=false;last=performance.now();return}
    travel(i)});
  const cvs=[...m.querySelectorAll('canvas[data-t]')];let k=0;
  (function next(){if(k>=cvs.length){const s=m.querySelector('canvas[data-soon]');if(s){const c=s.getContext('2d'),g=c.createLinearGradient(0,0,0,360);g.addColorStop(0,'#bfe3f7');g.addColorStop(1,'#ffffff');c.fillStyle=g;c.fillRect(0,0,640,360);c.fillStyle='#e3eef8';c.beginPath();c.moveTo(0,250);c.lineTo(150,140);c.lineTo(260,220);c.lineTo(400,110);c.lineTo(640,240);c.lineTo(640,360);c.lineTo(0,360);c.fill()}return}
    drawThumb(cvs[k],+cvs[k].dataset.t);k++;setTimeout(next,30)})();
  speak('Orman haritası');
}
function toastMap(t){speak(t);const m=$('#map'),d=el('div','',t);d.style.cssText='position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#fffaf0;border-radius:18px;padding:12px 18px;box-shadow:0 5px 0 rgba(0,0,0,.2);z-index:60;max-width:90%;font-size:17px;text-align:center';m.append(d);setTimeout(()=>d.remove(),3200)}

/* ---------- albüm ---------- */
function openAlbum(){
  ac();sfx.tap();paused=true;hush();
  let h=`<div class="chead"><img src="${portrait('sincap',140,128)}" alt=""><h2>Dost Kartları<small>${Object.values(S.an).filter(x=>x.friend).length} / ${Object.keys(ANIMALS).length} dost</small></h2><button class="x" data-x aria-label="Kapat">×</button></div><div class="cbody">`;
  REGIONS.forEach((R,i)=>{h+=`<div class="rsec">${i<S.unlocked?R.name:'???'}</div><div class="agrid">`;
    R.animals.forEach(k=>{const A=ANIMALS[k],fr=S.an[k]&&S.an[k].friend,open=i<S.unlocked;
      h+=`<div class="acard ${fr?'':'lock'}"><img src="${portrait(k,220,180)}" alt=""><b>${open?A.name:'???'}</b><small>${fr?foodHTML(A.food,'')+' '+FOODS[A.food].n:open?'Henüz arkadaş değilsiniz':'Kilitli bölüm'}</small>${fr?`<p>${A.fact}</p>`:''}</div>`});
    h+='</div>'});
  h+='</div>';
  const card=openOv(h);card.querySelector('[data-x]').onclick=()=>{sfx.tap();closeOv();paused=false;last=performance.now()};
}

/* ================= konfeti ================= */
function confetti(){
  if(reduced)return;const fx=$('#fx'),c=fx.getContext('2d'),d=Math.min(2,devicePixelRatio||1);
  const w=fx.width=innerWidth*d,h=fx.height=innerHeight*d;
  const cols=['#ff6b57','#ffc23c','#22a866','#3399e6','#ff8fb8','#8a5cd6'];
  const ps=[...Array(110)].map(()=>({x:w/2+(Math.random()-.5)*w*.2,y:h*.42,vx:(Math.random()-.5)*w*.03,vy:-Math.random()*h*.026-h*.006,s:(6+Math.random()*7)*d,c:pick(cols),r:Math.random()*6,leaf:Math.random()<.35}));
  let t=0;(function f(){c.clearRect(0,0,w,h);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=h*.0008;p.vx*=.99;p.r+=.15;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;if(p.leaf){E(c,0,0,p.s*.7,p.s*.32);c.fill()}else c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()});
    if(++t<140)requestAnimationFrame(f);else c.clearRect(0,0,w,h)})();
}

/* ================= başlat ================= */
$('#quizBtn').onclick=()=>{sfx.tap();openPuzzle()};
$('#mapBtn').onclick=openMap;
$('#albumBtn').onclick=openAlbum;
$('#sndBtn').onclick=()=>{MUTED=!MUTED;if(MUTED)hush();mainSave(m=>{m.muted=MUTED});renderHud();ac();sfx.tap()};
const embedded=window.top!==window;
if(embedded)$('#homeBtn').hidden=true;
$('#homeBtn').onclick=()=>{hush();location.href='../index.html#akl'};
let resizeT=0;addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{layout()},150)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush();last=performance.now()});
/* ortam sesleri */
setInterval(()=>{if(paused||document.hidden||MUTED||!AC)return;if(TH.birds&&Math.random()<.5)sfx.chirp();if(TH.frogs&&Math.random()<.35)setTimeout(sfx.croak,800)},7000);

$('#trio').innerHTML=['tavsan','sincap','fare'].map(k=>`<img src="${portrait(k,260,230)}" alt="">`).join('');
if(S.tut>0||S.solved>0){$('#playBtn').textContent='Devam et ▶';$('#splashSub').textContent=`${REGIONS[S.region].name} · ${Object.values(S.an).filter(x=>x.friend).length} dost`}
const startRegion=Math.min(S.region,S.unlocked-1,REGIONS.length-1);
TH=REGIONS[startRegion];
actors=TH.animals.map((k,j,a)=>makeActor(k,j,a.length,false));
layout();renderHud();renderInv();
requestAnimationFrame(loop);
$('#playBtn').onclick=()=>{
  ac();sfx.tap();$('#splash').hidden=true;
  if(!S.seen[startRegion]){S.seen[startRegion]=1;persist();actors=TH.animals.map((k,j,a)=>makeActor(k,j,a.length,true));setTimeout(()=>introRegion(startRegion),700)}
  else if(S.tut===1){talk('sincap','Aşağıdaki sepetten fındığı sürükleyip bana verir misin?',{sticky:true});renderInv()}
  else if(S.tut===2){talk('sincap','Bilmece Ağacı düğmesine dokun. Soruları çöz, yiyecek kazan!',{sticky:true,onShow:()=>$('#quizBtn').classList.add('want')})}
  else greet();
};
window.OD={get S(){return S},enterRegion,openPuzzle,openMap,openAlbum,showFriend,checkRegion,drawAnimalAt,ANIMALS,REGIONS,idleP,portrait,feed:(k,f)=>{const a=actors.find(x=>x.kind===k);a&&feed(a,f)},actors:()=>actors,pz:()=>PZ};
})();
</script>
