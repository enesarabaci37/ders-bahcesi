<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blok Çiftliği">
<meta name="theme-color" content="#8fc6ea">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Blok Çiftliği</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Blok Çiftliği: tam ekran 3B dünya. Üstte ince araç çubuğu, solda yürüme çubuğu, sağda zıplama, altta ince eşya rafı.
   Tek oyun görünümü (açık/koyu tema yok); bütün renkler burada. */
:root{
  --wood:#6b4426;--wood2:#8a5a33;--woodhi:#b07a44;
  --paper:#fffaf0;--ink:#24361f;--muted:#5f6f55;
  --leaf:#3f9a46;--leaf2:#2c7a35;--sun:#ffc23c;--sun2:#e09a0e;--coral:#ff6b57;--ok:#22a866;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --gx:max(10px,env(safe-area-inset-left,0px));--gxr:max(10px,env(safe-area-inset-right,0px));
  --dockh:72px;--bs:42px;--slot:50px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc6ea;color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:6px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:var(--gx);padding-right:var(--gxr)}
#hud>*{pointer-events:auto}
.rbtn{position:relative;height:var(--bs);min-width:var(--bs);border-radius:13px;background:rgba(255,250,240,.9);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;
  font-size:19px;box-shadow:0 3px 0 rgba(40,30,10,.22);flex:none;font-family:var(--display);font-weight:800;color:var(--wood)}
.rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(40,30,10,.22)}
.rbtn b{font-size:17px;font-variant-numeric:tabular-nums}
.rbtn.bump{animation:bump .45s}
.rbtn.want{animation:want 1s ease-in-out infinite}
.rbtn .dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:8px;background:var(--coral);color:#fff;font-size:10px;line-height:16px;text-align:center}
.sp{flex:1}
@keyframes bump{40%{transform:scale(1.2)}}
@keyframes want{50%{transform:scale(1.08);box-shadow:0 0 0 5px rgba(255,194,60,.9),0 3px 0 rgba(40,30,10,.22)}}

#guide{position:fixed;z-index:25;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--bs) + 16px);transform:translateX(-50%);width:min(520px,calc(100% - 24px));
  display:flex;gap:10px;align-items:center;background:rgba(255,250,240,.96);border-radius:18px;padding:8px 10px 12px 8px;box-shadow:0 5px 0 rgba(40,30,10,.2);animation:rise .3s;touch-action:none;transition:transform .2s,opacity .2s}
#guide:after{content:"";position:absolute;left:50%;bottom:4px;width:34px;height:4px;margin-left:-17px;border-radius:2px;background:rgba(90,70,40,.25)}
#guide .gi{width:42px;height:42px;border-radius:50%;background:#e8f2df;display:grid;place-items:center;font-size:24px;flex:none}
#guide p{margin:0;flex:1;font-size:15px;line-height:1.35}
#guide button{flex:none;border-radius:12px;background:var(--leaf);color:#fff;font-family:var(--display);font-size:15px;padding:7px 12px}
#guide.away{transform:translate(-50%,-140%);opacity:0}
#info{position:fixed;z-index:24;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--bs) + 16px);transform:translateX(-50%);width:min(420px,calc(100% - 24px));
  background:rgba(255,250,240,.97);border-radius:18px;padding:10px 12px;box-shadow:0 5px 0 rgba(40,30,10,.2);display:flex;gap:10px;align-items:center;animation:rise .25s}
#info .ie{font-size:36px;line-height:1}
#info .it{flex:1;min-width:0}
#info b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}
#info small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
#info .fol{margin-top:6px;border-radius:11px;background:var(--leaf);color:#fff;font-family:var(--display);font-size:15px;padding:5px 11px}
.bar{height:8px;border-radius:8px;background:#e4dcc6;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb04a,#ff7a3c);border-radius:8px}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px var(--gxr) calc(env(safe-area-inset-bottom,0px) + 6px) var(--gx);
  background:linear-gradient(180deg,rgba(176,122,68,.96) 0,rgba(138,90,51,.96) 6px,rgba(107,68,38,.96) 100%);border-top:2px solid #c08a52;border-radius:18px 18px 0 0;box-shadow:0 -4px 14px rgba(0,0,0,.16)}
#selName{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:rgba(30,30,20,.75);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .3s;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.bar2{display:flex;gap:6px;overflow-x:auto;padding:5px 2px 3px;scrollbar-width:none;align-items:center}
.bar2::-webkit-scrollbar{display:none}
.slot{position:relative;flex:none;width:var(--slot);height:var(--slot);border-radius:13px;background:#fff7e6;display:grid;place-items:center;
  box-shadow:inset 0 -4px 0 #e9d6b2,0 2px 0 rgba(0,0,0,.25);transition:transform .12s}
.slot img{width:76%;height:76%;image-rendering:pixelated;pointer-events:none}
.slot svg{pointer-events:none}
.slot .em{font-size:calc(var(--slot)*.5);line-height:1;pointer-events:none}
.slot .sub{position:absolute;right:3px;bottom:4px;font-size:13px;line-height:1;pointer-events:none}
.slot .cnt{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--coral);color:#fff;font-family:var(--display);font-size:12px;line-height:19px;text-align:center;font-variant-numeric:tabular-nums}
.slot.zero{opacity:.5}.slot.zero .cnt{background:#9b8a70}
.slot.sel{transform:translateY(-4px);box-shadow:inset 0 -4px 0 #e9d6b2,0 0 0 3px var(--sun),0 6px 0 rgba(0,0,0,.25)}
.slot.want{box-shadow:inset 0 -4px 0 #e9d6b2,0 0 0 4px rgba(255,194,60,.95),0 2px 0 rgba(0,0,0,.25)}
.sep{flex:none;width:2px;height:34px;border-radius:2px;background:rgba(255,255,255,.18)}

#joy{position:fixed;z-index:21;left:calc(var(--gx) + 8px);bottom:calc(var(--dockh) + 14px);width:112px;height:112px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,.28));border:2px solid rgba(255,255,255,.6);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,250,240,.92);box-shadow:0 2px 0 rgba(0,0,0,.22);pointer-events:none}
#jumpBtn{position:fixed;z-index:21;right:calc(var(--gxr) + 10px);bottom:calc(var(--dockh) + 18px);width:72px;height:72px;border-radius:50%;
  background:rgba(255,250,240,.82);border:2px solid rgba(255,255,255,.9);font-size:30px;color:var(--wood);box-shadow:0 4px 0 rgba(0,0,0,.22);touch-action:none}
#jumpBtn:before{content:"";position:absolute;inset:-26px;border-radius:50%}
#jumpBtn.on{transform:translateY(3px);background:#ffe6a0}
#hold{position:fixed;z-index:26;width:58px;height:58px;margin:-29px 0 0 -29px;pointer-events:none}
#hold circle{fill:none;stroke-width:6;stroke-linecap:round}
#hold .bg{stroke:rgba(0,0,0,.25)}#hold .fg{stroke:#fff;stroke-dasharray:157;stroke-dashoffset:157;transform:rotate(-90deg);transform-origin:50% 50%}
#hold.go .fg{animation:hold .5s linear forwards}
@keyframes hold{to{stroke-dashoffset:0}}

.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,32,18,.5);
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gxr) calc(env(safe-area-inset-bottom,0px) + 10px) var(--gx);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--paper);border-radius:24px;width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(180deg,#4fae55,var(--leaf2));color:#fff;border-radius:24px 24px 0 0;position:sticky;top:0;z-index:2}
.chead .ce{font-size:30px;line-height:1}
.chead h2{margin:0;font-family:var(--display);font-size:21px;line-height:1;flex:1;min-width:0}
.chead h2 small{display:block;font-family:var(--body);font-size:12px;opacity:.9;margin-top:3px}
.bal{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-family:var(--display);font-size:17px;flex:none}
.x{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;font-size:22px;display:grid;place-items:center;flex:none}
.cbody{padding:14px 14px 18px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;border-radius:14px;padding:8px;font-family:var(--display);font-size:17px;background:#efe6d2;color:var(--muted)}
.tab.on{background:var(--leaf);color:#fff}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:inset 0 -3px 0 #ece3cf;margin-bottom:8px}
.row .re{font-size:32px;width:42px;text-align:center;flex:none}
.row .rt{flex:1;min-width:0}
.row b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.row small{color:var(--muted);font-size:13px}
.btn{border-radius:12px;padding:8px 12px;font-family:var(--display);font-size:15px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -3px 0 var(--sun2);flex:none;white-space:nowrap}
.btn.green{background:linear-gradient(180deg,#5cc062,var(--leaf));color:#fff;box-shadow:inset 0 -3px 0 var(--leaf2)}
.btn.dis{background:#e8e2d4;color:#8d826b;box-shadow:inset 0 -3px 0 #d6cdb8}
.btn:active{transform:translateY(2px)}
.math{background:#fff3c4;border-radius:14px;padding:10px 12px;font-family:var(--display);font-size:20px;text-align:center;margin-bottom:10px;color:#5a3b00}
.empty{color:var(--muted);text-align:center;padding:18px}
.qbar{height:9px;border-radius:9px;background:#e4dcc6;overflow:hidden;margin-top:4px}
.qbar i{display:block;height:100%;background:var(--leaf)}
.mapwrap{position:relative;width:100%;max-width:min(520px,62vh);aspect-ratio:1;margin:0 auto 12px;border-radius:16px;overflow:hidden;background:#3d7fcf}
.mapwrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.mlab{position:absolute;transform:translate(-50%,-50%);background:rgba(255,250,240,.92);border-radius:999px;padding:2px 8px;font-size:12px;font-family:var(--display);white-space:nowrap;pointer-events:none}
.mme{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#ff3b5c;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}
.tps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tps .btn{display:flex;align-items:center;gap:6px;justify-content:center;padding:10px}
.menu .btn{display:block;width:100%;margin-bottom:8px;padding:12px;font-size:17px}

#pick{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.25);
  padding:12px var(--gxr) calc(env(safe-area-inset-bottom,0px) + 14px) var(--gx);max-height:56%;overflow:auto;animation:fade .25s}
#pick h2{margin:0 0 2px;font-family:var(--display);font-size:23px;color:var(--leaf2);text-align:center}
#pick h3{margin:8px 0 5px;font-family:var(--display);font-size:15px;color:var(--muted)}
.chs{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 6px;scrollbar-width:none}
.chs::-webkit-scrollbar{display:none}
.ch{flex:none;min-width:66px;height:66px;border-radius:16px;background:#fff;box-shadow:inset 0 -3px 0 #ece3cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 7px;font-size:11px;color:var(--muted)}
.ch.on{box-shadow:inset 0 -3px 0 #ece3cf,0 0 0 3px var(--sun)}
.ch i{display:block;width:36px;height:26px;border-radius:7px}
.ch i.two{background:linear-gradient(180deg,var(--a) 0 55%,var(--b) 55%)}
#pickOk{display:block;width:min(340px,100%);margin:10px auto 0;border-radius:16px;padding:11px;font-family:var(--display);font-size:21px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -4px 0 var(--sun2)}

.ft{position:fixed;z-index:30;pointer-events:none;font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:ftu 1.4s ease-out forwards;white-space:nowrap}
@keyframes ftu{to{transform:translate(-50%,-140%);opacity:0}}

#splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0),rgba(20,40,20,.5))}
#splash .logo{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,92px);line-height:.92;color:#fffaf0;text-shadow:0 4px 0 #2c6b2f,0 8px 0 rgba(0,0,0,.25)}
#splash .logo span{display:block;color:var(--sun);font-size:.62em}
#splash .cubes{display:flex;justify-content:center;gap:6px;margin:12px 0 18px}
#splash .cubes img{width:min(14vw,74px);image-rendering:pixelated;animation:bob 2.2s ease-in-out infinite}
#splash .cubes img:nth-child(2){animation-delay:.2s}#splash .cubes img:nth-child(3){animation-delay:.4s}#splash .cubes img:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
.big{display:block;width:min(300px,80vw);margin:0 auto;border-radius:18px;padding:12px;font-family:var(--display);font-size:27px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -5px 0 var(--sun2),0 4px 0 rgba(0,0,0,.2)}
#splash p{color:#fffaf0;font-size:15px;margin:12px 0 0;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#err{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#8fc6ea;padding:24px;text-align:center;font-size:20px}
@media (max-width:600px),(max-height:520px){:root{--bs:36px;--slot:42px}.rbtn{font-size:17px;padding:0 6px;border-radius:11px}.rbtn b{font-size:15px}
  #joy{width:96px;height:96px}#knob{width:42px;height:42px;margin:-21px 0 0 -21px}#jumpBtn{width:60px;height:60px;font-size:25px}#hud{gap:5px}}
@media (max-height:520px){#guide{width:min(460px,calc(100% - 200px))}#guide p{font-size:13px}#dock{padding-top:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button class="rbtn" id="homeBtn" aria-label="Ders Bahçesi'ne dön">‹</button>
  <button class="rbtn" id="coinBtn" aria-label="Altın">🪙<b id="coins">0</b></button>
  <button class="rbtn" id="questBtn" aria-label="Görevler">📜<span class="dot" id="qdot" hidden>!</span></button>
  <span class="sp"></span>
  <button class="rbtn" id="undoBtn" aria-label="Geri al">↶</button>
  <button class="rbtn" id="mapBtn" aria-label="Harita">🗺️</button>
  <button class="rbtn" id="camBtn" aria-label="Kamerayı değiştir"><span id="camIc">🧍</span></button>
  <button class="rbtn" id="shopBtn" aria-label="Pazar">🏪</button>
  <button class="rbtn" id="menuBtn" aria-label="Menü">☰</button>
</div>
<div id="guide" hidden><span class="gi">👩‍🌾</span><p id="gtext"></p><button id="gok">Tamam</button></div>
<div id="info" hidden></div>
<div id="joy" aria-label="Yürü"><div id="knob"></div></div>
<button id="jumpBtn" aria-label="Zıpla">⬆</button>
<svg id="hold" hidden viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="25"/><circle class="fg" cx="29" cy="29" r="25"/></svg>
<div id="dock"><div id="selName"></div><div class="bar2" id="bar"></div></div>
<div id="pick" hidden></div>
<div id="ov" class="ov" hidden></div>
<div id="splash"><div>
  <div class="logo">Blok<span>Çiftliği</span></div>
  <div class="cubes" id="cubes"></div>
  <button class="big" id="playBtn">Oyna ▶</button>
  <p id="splashSub">Köyünü kur, ek, biç, hayvanat bahçesini gez!</p>
</div></div>
<div id="err" hidden>Bu cihazda 3B oyun açılamadı. Lütfen tarayıcıyı güncelleyip tekrar dene.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;return}
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=n=>Math.floor(Math.random()*n),ri=(a,b)=>a+rnd(b-a+1),pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const now=()=>Date.now();
const V3=THREE.Vector3;

/* ================= ses ================= */
const MKEY='ders-bahcesi-v1';let MUTED=false;
try{const m=JSON.parse(localStorage.getItem(MKEY)||'null');if(m)MUTED=!!m.muted}catch(e){}
function mainSave(fn){try{const m=JSON.parse(localStorage.getItem(MKEY)||'null')||{level:{},stars:{},stats:{},review:{},seen:{},muted:false,voice:true,day:null};fn(m);localStorage.setItem(MKEY,JSON.stringify(m))}catch(e){}}
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,dur=.15,type='sine',vol=.12,when=0,f2,lp){
  if(MUTED||!AC)return;
  try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
    n.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}
}
let NB=null;
function noise(dur=.07,vol=.18,when=0,freq=1800,q=.8){
  if(MUTED||!AC)return;

function voxRay(o,d,max,test=isSolid){
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=Math.sign(d.x),sy=Math.sign(d.y),sz=Math.sign(d.z);
  const tdx=d.x?Math.abs(1/d.x):Infinity,tdy=d.y?Math.abs(1/d.y):Infinity,tdz=d.z?Math.abs(1/d.z):Infinity;
  let tmx=d.x>0?(x+1-o.x)*tdx:d.x<0?(o.x-x)*tdx:Infinity,tmy=d.y>0?(y+1-o.y)*tdy:d.y<0?(o.y-y)*tdy:Infinity,tmz=d.z>0?(z+1-o.z)*tdz:d.z<0?(o.z-z)*tdz:Infinity;
  let t=0,n=[0,0,0];
  for(let k=0;k<600&&t<=max;k++){
    if(k>0&&test(get(x,y,z)))return{x,y,z,n,t,id:get(x,y,z)};
    if(tmx<tmy&&tmx<tmz){x+=sx;t=tmx;tmx+=tdx;n=[-sx,0,0]}else if(tmy<tmz){y+=sy;t=tmy;tmy+=tdy;n=[0,-sy,0]}else{z+=sz;t=tmz;tmz+=tdz;n=[0,0,-sz]}
  }
  return null;
}

function onTap(cx,cy){

function tapBlock(h,pt){

    if(animals.some(a=>Math.floor(a.x)===x&&Math.floor(a.z)===z&&y>=Math.floor(a.y)&&y<a.y+a.h)){sfx.no();return}
    if(setBlock(x,y,z,s.b)){sfx.place();S.placed++;quest('place',1)}return}
  if(sel==='hoe'){if((id===B.GRASS||id===B.DIRT)&&n[1]>0&&!isOpaque(get(bx,by+1,bz))){dropDeco(key(bx,by+1,bz));setBlock(bx,by,bz,B.FARM);sfx.till();guideCheck('till')}else{sfx.no();floatText('Çapa çimen ya da toprakta çalışır',pt)}return}

    const k=key(bx,by+1,bz);if(crops.has(k)||get(bx,by+1,bz)){sfx.no();return}if(!(S.inv[sel]>0)){sfx.no();noStock(sel);return}

const QDEF={harvest_w:['buğday hasat et','🌾',3,6],harvest_c:['havuç hasat et','🥕',2,5],feed:['hayvan besle','❤️',3,6],place:['blok yerleştir','🧱',8,20],plant:['tohum ek','🌱',3,8],
