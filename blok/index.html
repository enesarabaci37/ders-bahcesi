<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blok Çiftliği">
<meta name="theme-color" content="#8fc6ea">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Blok Çiftliği</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Blok Çiftliği: tam ekran 3B dünya; üstte para/görev/kamera/pazar, solda yürüme çubuğu, sağda zıplama, altta eşya çubuğu.
   Tek oyun görünümü (açık/koyu tema yok); bütün renkler burada. */
:root{
  --wood:#6b4426;--wood2:#8a5a33;--woodhi:#b07a44;
  --paper:#fffaf0;--ink:#24361f;--muted:#5f6f55;
  --leaf:#3f9a46;--leaf2:#2c7a35;--sun:#ffc23c;--sun2:#e09a0e;--coral:#ff6b57;--ok:#22a866;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --gx:max(12px,env(safe-area-inset-left,0px));--gxr:max(12px,env(safe-area-inset-right,0px));
  --dockh:96px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc6ea;color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

#hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:var(--gx);padding-right:var(--gxr)}
#hud>*{pointer-events:auto}
.rbtn{position:relative;height:50px;min-width:50px;border-radius:16px;background:rgba(255,250,240,.94);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;
  font-size:24px;box-shadow:0 4px 0 rgba(40,30,10,.25);flex:none;font-family:var(--display);font-weight:800;color:var(--wood)}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,30,10,.25)}
.rbtn b{font-size:21px;font-variant-numeric:tabular-nums}
.rbtn small{font-family:var(--body);font-size:14px}
.rbtn.off{opacity:.6}
.rbtn.bump{animation:bump .45s}
.rbtn.want{animation:want 1s ease-in-out infinite}
.rbtn .dot{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:10px;background:var(--coral);color:#fff;font-size:12px;line-height:20px;text-align:center}
.sp{flex:1}
@keyframes bump{40%{transform:scale(1.22)}}
@keyframes want{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(255,194,60,.9),0 4px 0 rgba(40,30,10,.25)}}

#guide{position:fixed;z-index:25;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);width:min(580px,calc(100% - 24px));
  display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:22px;padding:10px 12px 10px 10px;box-shadow:0 6px 0 rgba(40,30,10,.22);animation:rise .3s}
#guide .gi{width:54px;height:54px;border-radius:50%;background:#e8f2df;display:grid;place-items:center;font-size:32px;flex:none}
#guide p{margin:0;flex:1;font-size:17px;line-height:1.35}
#guide button{flex:none;border-radius:14px;background:var(--leaf);color:#fff;font-family:var(--display);font-size:17px;padding:8px 14px}
#info{position:fixed;z-index:24;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);width:min(440px,calc(100% - 24px));
  background:var(--paper);border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 rgba(40,30,10,.22);display:flex;gap:12px;align-items:center;animation:rise .25s}
#info .ie{font-size:42px;line-height:1}
#info .it{flex:1;min-width:0}
#info b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
#info small{display:block;color:var(--muted);font-size:14px}
#info .fol{margin-top:6px;border-radius:12px;background:var(--leaf);color:#fff;font-family:var(--display);font-size:16px;padding:6px 12px}
.bar{height:9px;border-radius:9px;background:#e4dcc6;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb04a,#ff7a3c);border-radius:9px}
@keyframes rise{from{transform:translate(-50%,10px);opacity:0}}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px var(--gxr) calc(env(safe-area-inset-bottom,0px) + 10px) var(--gx);
  background:linear-gradient(180deg,var(--woodhi) 0,var(--wood2) 8px,var(--wood) 100%);border-top:3px solid #c08a52;border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.18)}
#selName{position:absolute;left:50%;top:-40px;transform:translateX(-50%);background:rgba(30,30,20,.78);color:#fff;border-radius:999px;padding:5px 14px;font-size:15px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.bar2{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;align-items:center}
.bar2::-webkit-scrollbar{display:none}
.slot{position:relative;flex:none;width:62px;height:62px;border-radius:16px;background:#fff7e6;display:grid;place-items:center;
  box-shadow:inset 0 -5px 0 #e9d6b2,0 3px 0 rgba(0,0,0,.25);transition:transform .12s}
.slot img{width:46px;height:46px;image-rendering:pixelated;pointer-events:none}
.slot .em{font-size:32px;line-height:1;pointer-events:none}
.slot .sub{position:absolute;right:4px;bottom:6px;font-size:16px;line-height:1;pointer-events:none}
.slot .cnt{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--coral);color:#fff;font-family:var(--display);font-size:15px;line-height:24px;text-align:center;font-variant-numeric:tabular-nums}
.slot.zero{opacity:.5}.slot.zero .cnt{background:#9b8a70}
.slot.sel{transform:translateY(-6px);box-shadow:inset 0 -5px 0 #e9d6b2,0 0 0 4px var(--sun),0 8px 0 rgba(0,0,0,.25)}
.slot.want{box-shadow:inset 0 -5px 0 #e9d6b2,0 0 0 5px rgba(255,194,60,.95),0 3px 0 rgba(0,0,0,.25)}
.sep{flex:none;width:3px;height:44px;border-radius:2px;background:rgba(255,255,255,.18)}

/* yürüme çubuğu ve zıplama */
#joy{position:fixed;z-index:21;left:calc(var(--gx) + 10px);bottom:calc(var(--dockh) + 18px);width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.32));border:3px solid rgba(255,255,255,.65);touch-action:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,250,240,.95);box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
#jumpBtn{position:fixed;z-index:21;right:calc(var(--gxr) + 14px);bottom:calc(var(--dockh) + 26px);width:86px;height:86px;border-radius:50%;
  background:rgba(255,250,240,.88);border:3px solid rgba(255,255,255,.9);font-size:40px;color:var(--wood);box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:none}
#jumpBtn.on{transform:translateY(3px);background:#ffe6a0}

.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(18,32,18,.5);
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gxr) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gx);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{background:var(--paper);border-radius:28px;width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(180deg,#4fae55,var(--leaf2));color:#fff;border-radius:28px 28px 0 0;position:sticky;top:0;z-index:2}
.chead .ce{font-size:38px;line-height:1}
.chead h2{margin:0;font-family:var(--display);font-size:24px;line-height:1;flex:1;min-width:0}
.chead h2 small{display:block;font-family:var(--body);font-size:13px;opacity:.9;margin-top:3px}
.bal{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-family:var(--display);font-size:20px;flex:none}
.x{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:26px;display:grid;place-items:center;flex:none}
.cbody{padding:16px 16px 20px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;border-radius:16px;padding:10px;font-family:var(--display);font-size:19px;background:#efe6d2;color:var(--muted)}
.tab.on{background:var(--leaf);color:#fff}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:inset 0 -4px 0 #ece3cf;margin-bottom:10px}
.row .re{font-size:38px;width:48px;text-align:center;flex:none}
.row .rt{flex:1;min-width:0}
.row b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}
.row small{color:var(--muted);font-size:14px}
.btn{border-radius:14px;padding:9px 14px;font-family:var(--display);font-size:17px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -4px 0 var(--sun2);flex:none;white-space:nowrap}
.btn.green{background:linear-gradient(180deg,#5cc062,var(--leaf));color:#fff;box-shadow:inset 0 -4px 0 var(--leaf2)}
.btn.dis{background:#e8e2d4;color:#8d826b;box-shadow:inset 0 -4px 0 #d6cdb8}
.btn:active{transform:translateY(2px)}
.math{background:#fff3c4;border-radius:16px;padding:12px 14px;font-family:var(--display);font-size:22px;text-align:center;margin-bottom:12px;color:#5a3b00}
.empty{color:var(--muted);text-align:center;padding:20px}
.qbar{height:10px;border-radius:10px;background:#e4dcc6;overflow:hidden;margin-top:5px}
.qbar i{display:block;height:100%;background:var(--leaf)}

/* karakter seçimi */
#pick{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--paper);border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.25);
  padding:14px var(--gxr) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gx);max-height:58%;overflow:auto;animation:fade .25s}
#pick h2{margin:0 0 4px;font-family:var(--display);font-size:26px;color:var(--leaf2);text-align:center}
#pick h3{margin:10px 0 6px;font-family:var(--display);font-size:17px;color:var(--muted)}
.chs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chs::-webkit-scrollbar{display:none}
.ch{flex:none;min-width:74px;height:74px;border-radius:18px;background:#fff;box-shadow:inset 0 -4px 0 #ece3cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 8px;font-size:12px;color:var(--muted)}
.ch.on{box-shadow:inset 0 -4px 0 #ece3cf,0 0 0 4px var(--sun)}
.ch i{display:block;width:40px;height:30px;border-radius:8px}
.ch i.two{background:linear-gradient(180deg,var(--a) 0 55%,var(--b) 55%)}
#pickOk{display:block;width:min(360px,100%);margin:12px auto 0;border-radius:18px;padding:12px;font-family:var(--display);font-size:24px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -5px 0 var(--sun2)}

.ft{position:fixed;z-index:30;pointer-events:none;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 8px rgba(0,0,0,.25);transform:translate(-50%,-50%);animation:ftu 1.4s ease-out forwards;white-space:nowrap}
@keyframes ftu{to{transform:translate(-50%,-140%);opacity:0}}

#splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,0),rgba(20,40,20,.5))}
#splash .logo{font-family:var(--display);font-weight:800;font-size:clamp(48px,12vw,96px);line-height:.92;color:#fffaf0;text-shadow:0 4px 0 #2c6b2f,0 8px 0 rgba(0,0,0,.25)}
#splash .logo span{display:block;color:var(--sun);font-size:.62em}
#splash .cubes{display:flex;justify-content:center;gap:6px;margin:14px 0 20px}
#splash .cubes img{width:min(16vw,84px);image-rendering:pixelated;animation:bob 2.2s ease-in-out infinite}
#splash .cubes img:nth-child(2){animation-delay:.2s}#splash .cubes img:nth-child(3){animation-delay:.4s}#splash .cubes img:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
.big{display:block;width:min(320px,80vw);margin:0 auto;border-radius:20px;padding:14px;font-family:var(--display);font-size:30px;background:linear-gradient(180deg,#ffd45e,var(--sun));color:#4a2d00;box-shadow:inset 0 -5px 0 var(--sun2),0 4px 0 rgba(0,0,0,.2)}
#splash p{color:#fffaf0;font-size:16px;margin:14px 0 0;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#err{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#8fc6ea;padding:24px;text-align:center;font-size:20px}
@media (max-width:620px){.rbtn{height:44px;min-width:44px;font-size:21px;padding:0 8px}.rbtn b{font-size:18px}.rbtn small{display:none}.slot{width:56px;height:56px}.slot img{width:40px;height:40px}
  #joy{width:116px;height:116px}#jumpBtn{width:74px;height:74px;font-size:34px}#hud{gap:6px}}
@media (max-width:440px){.rbtn{height:42px;min-width:40px;padding:0 6px;font-size:19px;border-radius:13px}.rbtn b{font-size:16px}#hud{gap:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <button class="rbtn" id="homeBtn" aria-label="Ders Bahçesi'ne dön">‹</button>
  <button class="rbtn" id="coinBtn" aria-label="Altın">🪙<b id="coins">0</b></button>
  <button class="rbtn" id="questBtn" aria-label="Görevler">📜<small>Görevler</small><span class="dot" id="qdot" hidden>!</span></button>
  <span class="sp"></span>
  <button class="rbtn" id="undoBtn" aria-label="Geri al">↶</button>
  <button class="rbtn" id="camBtn" aria-label="Kamera"><span id="camIc">🧍</span><small id="camTx">Karakter</small></button>
  <button class="rbtn" id="avBtn" aria-label="Karakterim">🎨</button>
  <button class="rbtn" id="shopBtn" aria-label="Pazar">🏪<small>Pazar</small></button>
  <button class="rbtn" id="sndBtn" aria-label="Ses">🔊</button>
</div>
<div id="guide" hidden><span class="gi">👩‍🌾</span><p id="gtext"></p><button id="gok">Tamam</button></div>
<div id="info" hidden></div>
<div id="joy" aria-label="Yürü"><div id="knob"></div></div>
<button id="jumpBtn" aria-label="Zıpla">⬆</button>
<div id="dock"><div id="selName"></div><div class="bar2" id="bar"></div></div>
<div id="pick" hidden></div>
<div id="ov" class="ov" hidden></div>
<div id="splash"><div>
  <div class="logo">Blok<span>Çiftliği</span></div>
  <div class="cubes" id="cubes"></div>
  <button class="big" id="playBtn">Oyna ▶</button>
  <p id="splashSub">Gez, inşa et, ek, hasat et, hayvanlarını besle!</p>
</div></div>
<div id="err" hidden>Bu cihazda 3B oyun açılamadı. Lütfen tarayıcıyı güncelleyip tekrar dene.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;return}
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=n=>Math.floor(Math.random()*n),ri=(a,b)=>a+rnd(b-a+1),pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const now=()=>Date.now();
const V3=THREE.Vector3;

/* ================= ses ================= */
const MKEY='ders-bahcesi-v1';let MUTED=false;
try{const m=JSON.parse(localStorage.getItem(MKEY)||'null');if(m)MUTED=!!m.muted}catch(e){}
function mainSave(fn){try{const m=JSON.parse(localStorage.getItem(MKEY)||'null')||{level:{},stars:{},stats:{},review:{},seen:{},muted:false,voice:true,day:null};fn(m);localStorage.setItem(MKEY,JSON.stringify(m))}catch(e){}}
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,dur=.15,type='sine',vol=.12,when=0,f2,lp){
  if(MUTED||!AC)return;
  try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let n=o;if(lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);n=fl}
    n.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}catch(e){}
}
let NB=null;
function noise(dur=.07,vol=.18,when=0,freq=1800,q=.8){
  if(MUTED||!AC)return;
  try{if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime+when;s.buffer=NB;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.02)}catch(e){}
}
const sfx={
  tap:()=>tone(560,.07,'triangle',.07),
  place:()=>{noise(.08,.22,0,900,1.2);tone(180,.08,'sine',.12)},
  dig:()=>{for(let i=0;i<3;i++)noise(.06,.2,i*.06,600+rnd(500),1.4)},
  till:()=>{noise(.12,.2,0,400,1);noise(.1,.15,.1,700,1)},
  plant:()=>{tone(500,.08,'sine',.08,0,700);noise(.05,.1,.05,2500)},
  harvest:()=>{noise(.08,.16,0,3000,2);tone(660,.1,'sine',.1,.05);tone(880,.14,'sine',.1,.13)},
  coin:()=>{tone(988,.08,'square',.05);tone(1319,.2,'square',.05,.08)},
  good:()=>{tone(660,.12,'sine',.12);tone(990,.18,'sine',.12,.1)},
  no:()=>{tone(330,.12,'sine',.09);tone(260,.16,'sine',.09,.13)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.24,'triangle',.12,i*.11)),
  crunch:()=>{for(let i=0;i<4;i++)noise(.05,.14,i*.16,1400+rnd(800))},
  jump:()=>tone(300,.12,'sine',.06,0,520),
  splash:()=>noise(.25,.16,0,900,.6),
  step:()=>noise(.04,.05,0,500+rnd(300),1.5),
  moo:()=>{tone(170,.9,'sawtooth',.06,0,120,700)},
  oink:()=>{tone(260,.12,'square',.04,0,200,900);tone(240,.12,'square',.04,.16,180,900)},
  baa:()=>{for(let i=0;i<5;i++)tone(320+(i%2)*25,.1,'sawtooth',.035,i*.08,null,1400)},
  cluck:()=>{for(let i=0;i<3;i++)tone(900+rnd(200),.05,'square',.03,i*.09,600,2500)},

function voxRay(o,d,max,test=isSolid){
  let x=Math.floor(o.x),y=Math.floor(o.y),z=Math.floor(o.z);
  const sx=Math.sign(d.x),sy=Math.sign(d.y),sz=Math.sign(d.z);

  let tmx=d.x>0?(x+1-o.x)*tdx:d.x<0?(o.x-x)*tdx:Infinity,tmy=d.y>0?(y+1-o.y)*tdy:d.y<0?(o.y-y)*tdy:Infinity,tmz=d.z>0?(z+1-o.z)*tdz:d.z<0?(o.z-z)*tdz:Infinity;
  let t=0,n=[0,0,0];
  for(let k=0;k<400&&t<=max;k++){
    if(k>0&&test(get(x,y,z)))return{x,y,z,n,t,id:get(x,y,z)};
    if(tmx<tmy&&tmx<tmz){x+=sx;t=tmx;tmx+=tdx;n=[-sx,0,0]}else if(tmy<tmz){y+=sy;t=tmy;tmy+=tdy;n=[0,-sy,0]}else{z+=sz;t=tmz;tmz+=tdz;n=[0,0,-sz]}
  }

}

  if(st<3){const pct=Math.round((now()-c.p)/GROW[c.t]*100);floatText(`${c.t==='w'?'🌾':'🥕'} %${pct} büyüdü`,pos);return}

  else{S.inv.havuc+=3;S.inv.tohum_h+=1;floatText('+3 🥕',pos);quest('harvest_c',1)}
  sfx.harvest();markAt(x,z,true);renderBar();dirty=true;guideCheck('harvest')}
function noStock(id){showGuideTemp(`Hiç ${ITEMN[id]} kalmadı. ${id.startsWith('tohum')?'Hasat yaparak ya da Pazar’dan alabilirsin.':id==='mama'?'Pazar’dan alabilirsin.':id==='sut'?'İnekleri besleyip süt toplayabilirsin.':'Tarlada yetiştirip hasat edebilirsin.'}`)}
function tapAnimal(A,pt){
  const T=AT[A.type],s=slotOf(sel),pos=new V3(A.x,A.y+A.h,A.z);
  if(s.k==='food'||s.k==='seed'){
    if(far(pos))return tooFar(pos);
    if(sel!==T.food){A.jump=.3;sfx.no();floatText(`${T.n} bunu yemez`,pos);showInfo(A,`${T.n} en çok ${ITEMN[T.food]} sever.`);return}
    if(!(S.inv[sel]>0)){noStock(sel);return}
    if(A.hunger>88){A.jump=.5;floatText('Karnım tok!',pos);return}
    S.inv[sel]--;A.hunger=Math.min(100,A.hunger+50);A.state='eat';A.eat=1.6;sfx.crunch();setTimeout(()=>sfx[T.snd](),900);
    if(T.prod&&!A.prod&&!A.prodT)A.prodT=now()+T.cd*1000;
    floatText('❤️ ❤️',pos);renderBar();quest('feed',1);guideCheck('feed');dirty=true;showInfo(A);return}
  A.jump=.6;sfx[T.snd]();floatText('❤️',pos);showInfo(A);
}
function collect(A){const p=A.prod;if(!p)return;A.prod=null;const pos=new V3(A.x,A.y+A.h+.5,A.z);
  if(p==='altin'){S.coins+=3;floatText('+3 🪙',pos);sfx.coin();renderHud()}
  else{S.inv[p]=(S.inv[p]||0)+1;floatText(`+1 ${PRODS[p].e}`,pos);sfx.good();quest('c_'+p,1);renderBar()}
  dirty=true;guideCheck('collect')}
let infoT=0;
function showInfo(A,extra){const T=AT[A.type],box=$('#info');const pr=T.prod?(A.prod?`${PRODS[T.prod].e} ${PRODS[T.prod].n} hazır, üstüne dokun!`:A.prodT?`${PRODS[T.prod].e} ${PRODS[T.prod].n} hazırlanıyor…`:`Beslersen ${PRODS[T.prod].e} ${PRODS[T.prod].n} verir`):'Beslenince çok mutlu olur';
  box.innerHTML=`<span class="ie">${T.e}</span><span class="it"><b>${T.n} · ${A.name}</b><small>Tokluk</small><div class="bar"><i style="width:${Math.round(A.hunger)}%"></i></div><small>Sever: ${ITEME[T.food]} ${ITEMN[T.food]} · ${pr}</small>${extra?`<small style="color:#b2372e">${extra}</small>`:''}${T.pet&&camMode!=='bird'?`<button class="fol" id="folBtn">${A.follow?'Burada bekle':'Peşimden gel'}</button>`:''}</span>`;
  box.hidden=false;clearTimeout(infoT);infoT=setTimeout(hideInfo,5000);
  const fb=$('#folBtn');if(fb)fb.onclick=()=>{A.follow=!A.follow;A.state='idle';A.stT=.2;sfx.good();dirty=true;showSel(A.follow?`${A.name} seni takip ediyor`:`${A.name} burada bekleyecek`);if(A.follow)sfx[T.snd]();showInfo(A)}}
function hideInfo(){$('#info').hidden=true}

/* ================= görevler ================= */
const QDEF={harvest_w:['buğday hasat et','🌾',3,6],harvest_c:['havuç hasat et','🥕',2,5],feed:['hayvan besle','❤️',3,6],place:['blok yerleştir','🧱',8,20],plant:['tohum ek','🌱',3,8],
  c_yumurta:['yumurta topla','🥚',2,4],c_sut:['süt topla','🥛',1,3],c_yun:['yün topla','🧶',1,3],c_mantar:['mantar bul','🍄',1,2],c_tuy:['tüy topla','🪶',1,3],sell:['ürün sat','🪙',3,8]};
const HAS={c_yumurta:'tavuk',c_sut:'inek',c_yun:'koyun',c_mantar:'domuz',c_tuy:'ordek'};
function newQuest(){const used=new Set(S.quests.map(q=>q.k));const ks=Object.keys(QDEF).filter(k=>!used.has(k)&&(!HAS[k]||animals.some(a=>a.type===HAS[k])));const k=pick(ks),d=QDEF[k],n=ri(d[2],d[3]);return{k,n,c:0,r:Math.max(5,n*2+ri(0,4))}}
function fillQuests(){while(S.quests.length<3)S.quests.push(newQuest())}
function quest(k,n){let any=false;S.quests.forEach(q=>{if(q.k===k&&q.c<q.n){q.c=Math.min(q.n,q.c+n);if(q.c>=q.n)any=true}});if(any){sfx.win();$('#qdot').hidden=false;$('#questBtn').classList.add('want');showGuideTemp('Bir görevi tamamladın! Ödülünü almak için Görevler’e dokun.')}}
function openQuests(){ac();sfx.tap();$('#questBtn').classList.remove('want');
  let h=`<div class="chead"><span class="ce">📜</span><h2>Görevler<small>Tamamla, altın kazan</small></h2><span class="bal">🪙 ${S.coins}</span><button class="x" data-x aria-label="Kapat">×</button></div><div class="cbody">`;
  S.quests.forEach((q,i)=>{const d=QDEF[q.k],done=q.c>=q.n;h+=`<div class="row"><span class="re">${d[1]}</span><span class="rt"><b>${q.n} ${d[0]}</b><small>${q.c} / ${q.n} · Ödül: ${q.r} 🪙</small><div class="qbar"><i style="width:${q.c/q.n*100}%"></i></div></span>${done?`<button class="btn green" data-q="${i}">Ödülü al</button>`:''}</div>`});
  h+=`<p class="empty" style="padding:6px">Tamamlanan görev: ${S.qdone}</p></div>`;
  const c=openOv(h);c.querySelector('[data-x]').onclick=closeOv;
  c.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=S.quests[+b.dataset.q];S.coins+=q.r;S.qdone++;S.quests.splice(+b.dataset.q,1,newQuest());sfx.coin();renderHud();dirty=true;
    mainSave(m=>{const d=today();if(!m.day||m.day.d!==d)m.day={d,rounds:0,stars:0,qs:0};m.day.rounds++;m.day.stars+=1;m.stars=m.stars||{};const st=m.stars.blok=m.stars.blok||{};st[S.qdone]=1;m.level=m.level||{};m.level.blok=1});
    speak(`Harika! ${q.r} altın kazandın.`);openQuests()});
  $('#qdot').hidden=!S.quests.some(q=>q.c>=q.n);speak('Görevler');
}

/* ================= pazar ================= */
const BUY=[{id:'tohum_b',n:'Buğday tohumu',e:'🌱',q:5,p:3},{id:'tohum_h',n:'Havuç tohumu',e:'🥕',q:5,p:4},{id:'mama',n:'Köpek maması',e:'🦴',q:3,p:5},
  {a:'fare',p:8},{a:'tavuk',p:12},{a:'ordek',p:14},{a:'tavsan',p:16},{a:'kedi',p:18},{a:'kopek',p:20},{a:'koyun',p:22},{a:'domuz',p:24},{a:'inek',p:30},{a:'at',p:40}];
let shopTab='sat';
function openShop(){ac();sfx.tap();renderShop()}
function renderShop(math){
  let h=`<div class="chead"><span class="ce">🏪</span><h2>Köy Pazarı<small>Ürünlerini sat, yeni şeyler al</small></h2><span class="bal">🪙 ${S.coins}</span><button class="x" data-x aria-label="Kapat">×</button></div><div class="cbody">
    <div class="tabs"><button class="tab ${shopTab==='sat'?'on':''}" data-tab="sat">Sat</button><button class="tab ${shopTab==='al'?'on':''}" data-tab="al">Al</button></div>${math?`<div class="math">${math}</div>`:''}`;
  if(shopTab==='sat'){const ks=['yumurta','sut','yun','tuy','mantar','bugday','havuc'].filter(k=>S.inv[k]>0);
    if(!ks.length)h+='<p class="empty">Satacak ürünün yok. Hayvanlarını besle, ürünlerini topla ya da hasat yap!</p>';
    ks.forEach(k=>{const Pp=PRODS[k],n=S.inv[k];h+=`<div class="row"><span class="re">${Pp.e}</span><span class="rt"><b>${n} ${Pp.n}</b><small>Tanesi ${Pp.p} altın</small></span><button class="btn" data-s1="${k}">1 sat</button>${n>1?`<button class="btn green" data-sa="${k}">Hepsini sat</button>`:''}</div>`})}
  else BUY.forEach((it,i)=>{const can=S.coins>=it.p;if(it.a){const T=AT[it.a],have=animals.filter(a=>a.type===it.a).length;
      h+=`<div class="row"><span class="re">${T.e}</span><span class="rt"><b>${T.n}</b><small>${T.prod?`${PRODS[T.prod].e} ${PRODS[T.prod].n} verir`:T.pet?'Seni takip edebilir':'Sevimli bir dost'} · ${ITEME[T.food]} ${ITEMN[T.food]} yer · Çiftlikte ${have} tane</small></span><button class="btn ${can?'':'dis'}" data-b="${i}">🪙 ${it.p}</button></div>`}
    else h+=`<div class="row"><span class="re">${it.e}</span><span class="rt"><b>${it.q} ${it.n}</b><small>Elinde ${S.inv[it.id]||0} tane</small></span><button class="btn ${can?'':'dis'}" data-b="${i}">🪙 ${it.p}</button></div>`});
  h+='</div>';
  const c=openOv(h);c.querySelector('[data-x]').onclick=closeOv;
  c.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{sfx.tap();shopTab=b.dataset.tab;renderShop()});
  const sell=(k,n)=>{const Pp=PRODS[k],sum=n*Pp.p;S.inv[k]-=n;S.coins+=sum;sfx.coin();renderHud();renderBar();quest('sell',n);dirty=true;
    const m=n>1?`${n} ${Pp.n} × ${Pp.p} altın = ${sum} altın`:`1 ${Pp.n} = ${sum} altın`;speak(m);renderShop(m)};
  c.querySelectorAll('[data-s1]').forEach(b=>b.onclick=()=>sell(b.dataset.s1,1));
  c.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>sell(b.dataset.sa,S.inv[b.dataset.sa]));
  c.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const it=BUY[+b.dataset.b];if(S.coins<it.p){sfx.no();speak(`${it.p-S.coins} altın daha lazım.`);return}
    S.coins-=it.p;sfx.coin();renderHud();dirty=true;
    if(it.a){closeOv();const A=addAnimal(it.a,PEN.x0+5+Math.random()*4,PEN.z0+4+Math.random()*4,{h:40});A.jump=.8;sfx[AT[it.a].snd]();
      showGuideTemp(`Yeni dostun ${AT[it.a].n} ${A.name} ağıla geldi!`);fillQuests();dirty=true}
    else{S.inv[it.id]=(S.inv[it.id]||0)+it.q;renderBar();renderShop(`+${it.q} ${it.n}`)}});
}
function openOv(h){const o=$('#ov');o.innerHTML=`<div class="card">${h}</div>`;o.hidden=false;return o.firstChild}
function closeOv(){sfx.tap();$('#ov').hidden=true;$('#ov').innerHTML=''}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv()});
function renderHud(){$('#coins').textContent=S.coins;$('#sndBtn').textContent=MUTED?'🔇':'🔊';$('#sndBtn').classList.toggle('off',MUTED);const b=$('#coinBtn');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}

/* ================= karakter seçimi ================= */
let picking=false;
function openPick(first){
  picking=true;sfx.tap();const pk=$('#pick');
  const row=(title,arr,keyName,fn)=>`<h3>${title}</h3><div class="chs">${arr.map((v,i)=>`<button class="ch ${S.av[keyName]===i?'on':''}" data-k="${keyName}" data-i="${i}">${fn(v)}</button>`).join('')}</div>`;
  pk.innerHTML=`<h2>Karakterini seç</h2>`+
    row('Saç',HAIRS,'hair',h=>`<i style="background:${h.c}"></i>${h.n}`)+
    row('Kıyafet',OUTFITS,'shirt',o=>`<i class="two" style="--a:${o[0]};--b:${o[1]}"></i>`)+
    row('Ten rengi',SKINS,'skin',s=>`<i style="background:${s};border-radius:50%;width:34px;height:34px"></i>`)+
    `<button id="pickOk">${first?'Bu benim! Hadi başlayalım ▶':'Tamam'}</button>`;
  pk.hidden=false;$('#hud').hidden=true;$('#joy').hidden=true;$('#jumpBtn').hidden=true;$('#guide').hidden=true;
  pk.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{S.av[b.dataset.k]=+b.dataset.i;sfx.tap();buildPlayer();pk.querySelectorAll(`.ch[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle('on',x===b));dirty=true});
  $('#pickOk').onclick=()=>{sfx.good();pk.hidden=true;picking=false;camera.clearViewOffset();$('#hud').hidden=false;setCam(camMode);dirty=true;if(first){S.tut=Math.max(S.tut,1);guideShow()}};
  if(first)speak('Karakterini seç! Saçını, kıyafetini ve ten rengini seçebilirsin.');
}
function pickCam(){const fx=Math.sin(P.face),fz=Math.cos(P.face);camera.position.set(P.x+fx*5.2,P.y+1.5,P.z+fz*5.2);camera.lookAt(P.x,P.y+1,P.z);
  const w=innerWidth,h=innerHeight,ph=$('#pick').offsetHeight;camera.setViewOffset(w,h,0,Math.min(h*.22,ph*.4),w,h)}

/* ================= öğretici ================= */
const MARK=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTex('⬇️','rgba(255,214,90,.95)'),depthWrite:false,depthTest:false}));MARK.scale.set(1.4,1.4,1);MARK.visible=false;MARK.renderOrder=10;scene.add(MARK);
const TUT=[
  {t:'pick'},
  {t:'Merhaba! Soldaki yuvarlak çubukla yürü, ⬆ düğmesiyle zıpla. Parmağını ekranda kaydırarak etrafa bak.',w:'walk'},
  {t:'Harika! Şimdi sarı okun olduğu tarlaya yürü. Çapa’yı seç ve çimene dokun, tarla açılır.',w:'till',slot:'hoe',mark:[FIELD.x0-2,8.5,FIELD.z1+2]},
  {t:'Şimdi Buğday tohumunu seç ve açtığın tarlaya dokun.',w:'plant',slot:'tohum_b'},
  {t:'Tohum büyüyor! Ağıldaki hayvanlar acıkmış. Oka doğru yürü, Buğday’ı seç ve bir ineğe dokun.',w:'feed',slot:'bugday',mark:[33,9,66]},
  {t:'Hayvanlar beslenince ürün verir. Süt ya da yumurta çıkınca üstüne dokunup topla. Olgun sarı ekinlere El ile dokunarak hasat yapabilirsin.',w:'collect'},
  {t:'Kedi sütü çok sever, köpek de seni takip edebilir! Ürünlerini Pazar’da sat, bloklarla istediğini inşa et. Kuş bakışı kamerası inşa için çok kullanışlı. İyi eğlenceler!',ok:1}];
function guideShow(){const g=TUT[S.tut];const box=$('#guide');MARK.visible=false;
  if(!g){box.hidden=true;renderBar();return}if(g.t==='pick'){box.hidden=true;openPick(true);return}
  $('#gtext').textContent=g.t;$('#gok').hidden=!g.ok;box.hidden=false;speak(g.t);
  if(g.mark){MARK.position.set(g.mark[0],g.mark[1],g.mark[2]);MARK.visible=true}
  renderBar();if(g.slot){const s=document.querySelector(`.slot[data-id="${g.slot}"]`);if(s)s.scrollIntoView({inline:'center',block:'nearest'})}}
let walkAcc=0;
function guideCheck(ev){const g=TUT[S.tut];if(!g||!g.w)return;
  if(ev==='walk'&&g.w==='walk'){walkAcc++;if(walkAcc<25)return}
  if(ev===g.w||(g.w==='collect'&&ev==='harvest')){S.tut++;dirty=true;sfx.good();setTimeout(guideShow,700)}}
$('#gok').onclick=()=>{sfx.tap();S.tut++;dirty=true;guideShow()};
let gtT=0;function showGuideTemp(t){if(TUT[S.tut])return;const box=$('#guide');$('#gtext').textContent=t;$('#gok').hidden=true;box.hidden=false;speak(t);clearTimeout(gtT);gtT=setTimeout(()=>{if(!TUT[S.tut])box.hidden=true},4200)}

/* ================= döngü ================= */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?66:55;camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--dockh',$('#dock').offsetHeight+'px')}
addEventListener('resize',resize);
let last=performance.now(),acc=0,plantT=0,started=false;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!document.hidden){const ts=t/1000;
    if(started&&!picking)updPlayer(dt);else if(P.model){P.model.position.set(P.x,P.y,P.z);P.model.rotation.y=P.face}
    animals.forEach(a=>updAnimal(a,dt,ts));
    clouds.children.forEach((c,i)=>{c.position.x+=dt*(1+i%3*.5);if(c.position.x>230)c.position.x=-130});
    waterTex.offset.set((ts*.05)%1,(ts*.03)%1);oceanTex.offset.x=(ts*.02)%1;
    if(MARK.visible)MARK.position.y+=Math.sin(ts*4)*.01;
    plantT+=dt;if(plantT>1){plantT=0;crops.forEach((c,k)=>{if(c.st!==undefined&&cropStage(c)!==c.st){const [x,,z]=k.split(',').map(Number);markAt(x,z,true)}})}
    flushChunks();
    if(picking)pickCam();else updCam();
    acc+=dt;if(acc>5){acc=0;if(dirty)save()}
    renderer.render(scene,camera)}
  requestAnimationFrame(frame);
}
setInterval(()=>{if(document.hidden||MUTED||!AC||!started)return;if(Math.random()<.55)sfx.chirp();else{const near=animals.filter(a=>Math.hypot(a.x-P.x,a.z-P.z)<16);if(near.length){const a=pick(near);sfx[AT[a.type].snd]()}}},8000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);

/* ================= başlat ================= */
const how=load();
buildAll();
if(how==='v2'&&S.animals&&S.animals.length){const mins=(now()-(S.t||now()))/60000;S.animals.forEach(a=>addAnimal(a.t,a.x,a.z,{name:a.name,h:Math.max(15,a.h-mins*1.5),pt:a.pt,prod:a.prod,f:a.f}))}
else{const start=[['inek',30,66],['inek',36,70],['koyun',34,64],['koyun',29,71],['domuz',37,66],['tavuk',31,68],['tavuk',33,70],['tavuk',35,72],['at',28,64],['kopek',46,52],['kedi',50,53],['fare',44,57],['ordek',66,70],['ordek',68,68],['tavsan',40,30],['tavsan',58,30]];
  start.forEach(([t,x,z])=>addAnimal(t,x+.5,z+.5,{h:ri(20,40)}));
  if(how==='old'&&S.oldAnimals)S.oldAnimals.filter(t=>AT[t]).forEach(t=>addAnimal(t,PEN.x0+3+Math.random()*9,PEN.z0+3+Math.random()*8,{h:40}))}
P.x=S.player.x;P.y=S.player.y;P.z=S.player.z;P.face=S.player.face;cyaw=P.face+Math.PI;
if(boxHit(P.x,P.y,P.z)){P.y=groundAt(P.x,P.z,WY).y}
buildPlayer();fillQuests();
resize();setCam(S.cam||'char');updCam();renderBar();renderHud();
$('#cubes').innerHTML=[B.GRASS,B.PLANKS,B.BRICK,B.LOG].map(b=>`<img src="${cubeIcon(b)}" alt="">`).join('');
if(how==='v2'){$('#playBtn').textContent='Devam et ▶';$('#splashSub').textContent=`${animals.length} hayvan · ${S.coins} altın`}
if(how==='old')$('#splashSub').textContent='Çiftliğin büyüdü! Altınların ve hayvanların yeni köye taşındı.';
const embedded=window.top!==window;if(embedded)$('#homeBtn').hidden=true;
$('#homeBtn').onclick=()=>{save();location.href='../index.html#akl'};
$('#shopBtn').onclick=openShop;$('#questBtn').onclick=openQuests;$('#coinBtn').onclick=openShop;$('#avBtn').onclick=()=>openPick(false);
$('#camBtn').onclick=()=>{sfx.tap();const order=['char','fp','bird'];setCam(order[(order.indexOf(camMode)+1)%3]);showSel(CAMS[camMode][1]+' kamerası');dirty=true};
$('#undoBtn').onclick=()=>{const u=undo.pop();if(!u){sfx.no();showSel('Geri alınacak bir şey yok');return}setBlock(u.x,u.y,u.z,u.prev,false);sfx.tap();showSel('Geri alındı')};
$('#sndBtn').onclick=()=>{MUTED=!MUTED;mainSave(m=>{m.muted=MUTED});if(MUTED)try{speechSynthesis.cancel()}catch(e){}renderHud();ac();sfx.tap()};
$('#playBtn').onclick=()=>{ac();sfx.tap();$('#splash').hidden=true;started=true;if(TUT[S.tut])guideShow();else showGuideTemp('Tekrar hoş geldin! Hayvanların seni bekliyordu.')};
requestAnimationFrame(frame);
window.BC={get S(){return S},P,animals,crops,get,setBlock,onTap,openShop,openQuests,camera,screenOf,THREE,save,setCam,
  cam:(y,p,d)=>{cyaw=y;cpitch=p;cdist=d},bird:(y,p,d,x,z)=>{byaw=y;bpitch=p;bdist=d;tgt.x=x;tgt.z=z},JOY,KEYS,get started(){return started},guide:()=>S.tut};
})();
</script>
