<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ders Bahçesi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6F3EC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Ders Bahçesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Ders Bahçesi: 2. sınıf için dört ders + zeka oyunları. iPad Safari için büyük dokunma alanları, hover yok. */
:root{
  --bg:#E6F3EC; --dots:#CFE6DA; --ink:#1E3A4A; --muted:#557282; --card:#FFFFFF; --well:#D3E8DE;
  --coral:#FF6B57; --sun:#FFC23C; --leaf:#22A866; --sky:#3399E6; --grape:#8A5CD6;
  --ok:#22A866; --no:#E5484D;
  --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --gc:var(--coral);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{
  margin:0;font-family:var(--body);font-weight:700;font-size:17px;
  background-image:radial-gradient(var(--dots) 1.6px, transparent 1.7px);background-size:22px 22px;
  min-height:100%;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.app{max-width:980px;margin:0 auto;padding-block:18px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- home ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1;margin:0;letter-spacing:-.5px}
h1 span{color:var(--leaf)}
.sub{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:36ch}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools{display:flex;gap:8px}
.score{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px 6px 10px;
  box-shadow:0 3px 0 var(--well);font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.score .star{color:var(--sun);font-size:26px;line-height:1}
.tbtn{background:var(--card);border:0;border-radius:999px;width:48px;height:48px;font-size:22px;box-shadow:0 3px 0 var(--well);flex:none}
.tbtn.off{opacity:.55}
.today{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 16px;margin-bottom:16px;box-shadow:0 4px 0 var(--well)}
.today .ti{font-size:30px}
.today .tt{flex:1;min-width:0}
.today b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.today small{color:var(--muted);font-size:14px}
.goal{display:flex;gap:6px}
.goal i{width:26px;height:26px;border-radius:50%;background:var(--well);display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff}
.goal i.on{background:var(--leaf)}
.subjects{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:24px;padding:16px;min-height:96px;
  background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(30,58,74,.22);transition:transform .12s}
.gcard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,58,74,.22)}
.gcard.dark{color:var(--ink)}
.gicon{flex:none;width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:36px}
.gtext{flex:1;min-width:0;display:flex;flex-direction:column}
.gname{font-family:var(--display);font-size:26px;line-height:1.1}
.gdesc{font-size:14px;opacity:.95}
.gmeta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px}
.lvl{background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
.gst{font-variant-numeric:tabular-nums;white-space:nowrap}
.foot{color:var(--muted);font-size:14px;text-align:center;margin-top:26px}
.foot p{margin:8px 0 0}
.linkbtn{border:0;background:var(--card);border-radius:999px;padding:10px 18px;box-shadow:0 3px 0 var(--well);color:var(--ink)}

/* subject list */
.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-top:14px}
.acard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:20px;padding:12px 14px;min-height:84px;
  background:var(--card);box-shadow:0 5px 0 var(--well);border-left:8px solid var(--c)}
.acard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--well)}
.acard .gicon{width:54px;height:54px;font-size:32px;background:var(--bg)}
.acard .gname{font-size:21px}
.acard .gdesc{color:var(--muted);opacity:1}
.acard .lvl{background:var(--bg)}
.acard .gst{color:#B07A00}
.now{display:inline-block;background:var(--sun);color:var(--ink);border-radius:999px;font-size:12px;padding:0 8px;margin-left:4px;vertical-align:middle}

/* ---------- play ---------- */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;gap:8px;
  background:var(--bg);padding-block:6px 10px;margin-bottom:6px}
.navback{border:0;background:var(--card);border-radius:999px;padding:0 16px;height:48px;box-shadow:0 3px 0 var(--well);white-space:nowrap;flex:none}
.pt{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.1}
.chip{background:var(--gc);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px;white-space:nowrap}
.chip.dark{color:var(--ink)}
.stage{max-width:700px;margin:0 auto}
.hint{text-align:center;color:var(--muted);margin:4px auto 14px;max-width:40ch;font-size:16px;text-wrap:balance}
#status{text-align:center;font-family:var(--display);font-size:20px;min-height:1.4em;margin:16px 0 0;font-variant-numeric:tabular-nums}

.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--well)}
.dot.now{background:var(--ink)} .dot.ok{background:var(--ok)} .dot.no{background:var(--sun)}

.passage{background:#FFFBEA;border-radius:20px;padding:14px 18px;margin-bottom:14px;box-shadow:0 4px 0 #F2E3B0}
.passage h3{font-family:var(--display);font-size:24px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.passage p{margin:0;font-size:19px;line-height:1.6;font-weight:600}
.qcard{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--well)}
.qtext{flex:1;min-width:0;font-size:21px;line-height:1.4;padding-top:6px;text-wrap:pretty}
.qtext b{color:var(--gc)}
.say{flex:none;border:0;width:48px;height:48px;border-radius:50%;background:var(--bg);font-size:22px}
.say.sm{width:42px;height:42px;font-size:19px}
.vis{margin:14px 0 0;display:flex;justify-content:center}
.vis:empty{display:none}
.wbox{margin-top:16px}
.fb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:18px;padding:12px 16px;margin-top:16px;font-size:18px;animation:rise .3s both}
.fb .fi{font-size:30px;line-height:1}
.fb .ft{flex:1;min-width:200px}
.fb.hint{background:#FFF1C9}
.fb.good{background:#DDF5E7;justify-content:center;font-family:var(--display);font-size:24px}
.fb.exp{background:#E3F0FC}
.go{border:0;border-radius:999px;padding:12px 26px;background:var(--ink);color:#fff;font-family:var(--display);font-size:21px;box-shadow:0 4px 0 rgba(30,58,74,.3);min-height:52px}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,58,74,.3)}
.go.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--well)}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:16px}

/* multiple choice */
.chs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ch{min-height:64px;border:0;border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--well);padding:10px 14px;font-size:20px;line-height:1.25;text-wrap:balance}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 var(--well)}
.chs.pics{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.chs.pics .ch{font-size:54px;min-height:110px;line-height:1}
.chs.pics .ch small{display:block;font-size:15px;margin-top:4px}
.chs.syms .ch{font-family:var(--display);font-size:40px}
.chs.long{grid-template-columns:1fr}
.chs.long .ch{text-align:left;font-size:19px}
.ch svg{width:90px;height:90px;display:block;margin:0 auto}
.ch.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 #17804c}
.ch.no{background:#FBD9D8;color:#9B2C2F;animation:shake .4s;box-shadow:0 5px 0 #F0B5B3}
.ch:disabled{cursor:default}

/* keypad */
.ndisp{margin:0 auto 14px;max-width:320px;min-height:72px;background:var(--card);border-radius:18px;box-shadow:inset 0 0 0 3px var(--well);
  display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:40px;font-variant-numeric:tabular-nums}
.ndisp small{font-size:22px;color:var(--muted)}
.ndisp.ok{background:#DDF5E7;box-shadow:inset 0 0 0 3px var(--ok)}
.ndisp.no{background:#FBD9D8;animation:shake .4s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.key{height:64px;border:0;border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--well);font-family:var(--display);font-size:30px}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 var(--well)}
.key.ok{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #17804c}
.key.del{color:var(--muted)}

/* visuals */
.col{font-family:var(--display);font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums;background:var(--card);border-radius:18px;padding:10px 26px;box-shadow:0 4px 0 var(--well);display:inline-grid;grid-template-columns:auto auto auto;column-gap:10px;text-align:center}
.col .op{color:var(--gc)} .col .ln{grid-column:1/-1;border-top:4px solid var(--ink);margin:4px 0}
.col .hd{font-family:var(--body);font-size:13px;color:var(--muted)}
.blk{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:center;min-height:150px;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--well)}
.rods{display:flex;gap:6px;flex-wrap:wrap;max-width:300px}
.rod{width:18px;height:140px;border-radius:4px;background:var(--sky);background-image:repeating-linear-gradient(to bottom,transparent 0 12px,rgba(255,255,255,.75) 12px 14px);box-shadow:0 3px 0 #1f6fb2;animation:pop .3s}
.ones{display:grid;grid-template-columns:repeat(3,18px);gap:5px;align-content:end}
.cube{width:18px;height:18px;border-radius:4px;background:var(--sun);box-shadow:0 2px 0 #c58f00;animation:pop .3s}
.blk .lbl{width:100%;text-align:center;color:var(--muted);font-size:15px}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plate{background:var(--card);border-radius:50%;width:110px;height:110px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;font-size:24px;box-shadow:0 4px 0 var(--well);padding:12px}
.emrow{font-size:30px;line-height:1.3;text-align:center;letter-spacing:2px;max-width:560px}
.svgv{width:100%;max-width:560px;height:auto;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--well)}
.svgs{width:min(260px,70vw);height:auto}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--card);border-radius:20px;padding:14px 10px;box-shadow:0 4px 0 var(--well)}
.tile{min-width:52px;height:52px;padding:0 8px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:26px;animation:rise .3s both}
.tile.q{background:var(--grape);color:#fff}
.money{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:17px;line-height:1;text-align:center;
  background:radial-gradient(circle at 35% 30%,#FFF0B3,#E2B33C 70%);color:#5C4200;box-shadow:inset 0 0 0 4px #C9962A,0 3px 0 rgba(0,0,0,.15)}
.coin.lira{background:radial-gradient(circle at 50% 50%,#F5D96B 0 45%,#D9DDE2 47%,#AEB5BD 100%);box-shadow:inset 0 0 0 4px #9AA2AA,0 3px 0 rgba(0,0,0,.15)}
.coin.k1,.coin.k5{width:48px;height:48px;font-size:14px}
.note{width:98px;height:54px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);
  background-image:linear-gradient(90deg,rgba(255,255,255,.18) 0 22%,transparent 22%)}
.note.n5{background-color:#8B6BB0}.note.n10{background-color:#D9534F}.note.n20{background-color:#3A9D5D}.note.n50{background-color:#E8913A}.note.n100{background-color:#3B7DD8}.note.n200{background-color:#D46BA3}
.signs{display:flex;justify-content:center}
.pic{font-size:72px;line-height:1}
.ptable{border-collapse:separate;border-spacing:0 6px;background:var(--card);border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 var(--well)}
.ptable td{padding:2px 8px;font-size:18px}
.ptable td.ic{font-size:28px;letter-spacing:2px}
.ptable th{font-family:var(--display);font-size:19px;padding:4px 8px;text-align:left}
.ptable .nm{font-weight:800}
.ptable.num td{border-bottom:2px solid var(--well);font-size:22px;text-align:center}

/* clock widget */
.clockbox{width:min(300px,78vw);margin:0 auto;touch-action:none}
.clk{width:100%;height:auto;display:block}
.clk .mh{cursor:grab}

/* blocks builder */
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:14px auto 0}
.bbtns .go{font-size:19px}
.tens{background:var(--sky)!important} .onesb{background:#E0A800!important}

/* hundred chart */
.hgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:560px;margin:0 auto}
.hc{aspect-ratio:1;border:0;border-radius:8px;background:var(--card);font-family:var(--display);font-size:clamp(14px,3.6vw,22px);padding:0;box-shadow:0 2px 0 var(--well)}
.hc.st{background:var(--sun)} .hc.ok{background:var(--ok);color:#fff} .hc.no{background:var(--no);color:#fff;animation:shake .4s}
.hc.rv{background:#BFE3FF}

/* money widget */
.tray{min-height:84px;background:#F4ECD9;border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(0,0,0,.06)}
.tray:empty::before{content:"Paraları buraya koy";color:#A08C64}
.tray button,.mpal button{border:0;background:none;padding:0}
.mpal{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

/* order widget */
.oline{min-height:70px;background:var(--card);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:inset 0 0 0 3px var(--well);align-items:flex-start}
.oline.wide,.opool.wide{flex-direction:column;align-items:stretch}
.oline:empty::before{content:"Sırayla dokun…";color:var(--muted);padding:10px}
.opool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.oi{border:0;border-radius:14px;background:var(--card);box-shadow:0 4px 0 var(--well);padding:12px 16px;font-size:20px;min-height:52px;text-align:left}
.oline .oi{background:#E3F0FC;box-shadow:none}
.oi .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sky);color:#fff;font-size:15px;margin-right:8px}
.oline.ok .oi{background:#DDF5E7} .oline.no{animation:shake .4s}

/* tap word */
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 0 var(--well)}
.wd{border:0;border-radius:12px;background:var(--bg);padding:10px 14px;font-size:24px;min-height:54px}
.wd.ok{background:var(--ok);color:#fff} .wd.no{background:#FBD9D8;animation:shake .4s}

/* robot */
.rgrid{display:grid;gap:4px;max-width:420px;margin:0 auto;background:var(--well);padding:6px;border-radius:18px}
.rc{aspect-ratio:1;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:clamp(22px,6vw,38px);position:relative}
.rc.path{background:#E3F0FC}
.rc.bump{animation:shake .4s;background:#FBD9D8}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;background:var(--card);border-radius:16px;padding:8px;margin:14px auto 0;max-width:560px;box-shadow:inset 0 0 0 3px var(--well)}
.prog:empty::before{content:"Okları seç, robotun yolunu yaz";color:var(--muted);padding:8px}
.prog span{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--grape);color:#fff;font-size:22px}
.prog span.run{background:var(--sun);color:var(--ink)}
.arrows{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;margin-top:14px}
.arrows .key{font-size:30px;height:64px}

/* symmetry */
.sgrid{display:grid;gap:4px;max-width:420px;margin:0 auto;background:var(--well);padding:6px;border-radius:16px;position:relative}
.sc{aspect-ratio:1;border:0;border-radius:6px;background:var(--card);padding:0}
.sc.on{background:var(--grape)} .sc.fix{cursor:default}
.sc.miss{background:#C8B4F0;box-shadow:inset 0 0 0 3px var(--grape)} .sc.extra{background:#FBD9D8}
.sc.mr{margin-right:6px} .sc.ml{margin-left:6px}
.mirror{position:absolute;top:0;bottom:0;width:4px;background:var(--coral);border-radius:2px;transform:translateX(-2px)}

/* cards (English) */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab{flex:none;border:0;border-radius:999px;padding:10px 16px;background:var(--card);box-shadow:0 3px 0 var(--well);font-size:16px;min-height:46px}
.tab.on{background:var(--grape);color:#fff;box-shadow:0 3px 0 #6b44b0}
.wcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.wc{border:0;border-radius:20px;background:var(--card);box-shadow:0 5px 0 var(--well);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;justify-content:center}
.wc:active{transform:translateY(3px);box-shadow:0 2px 0 var(--well)}
.wc .e{font-size:54px;line-height:1.1}
.wc .w{font-family:var(--display);font-size:26px;line-height:1}
.wc .t{font-size:14px;color:var(--muted)}
.wc.lit{background:#F1EAFD;animation:pop .35s}
.sw{display:inline-block;width:58px;height:58px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.ch .sw{width:70px;height:70px}

/* parent */
.ptab{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--well);margin-bottom:18px;font-size:15px}
.ptab th,.ptab td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--well);vertical-align:top}
.ptab th{background:var(--c);color:#fff;font-family:var(--display);font-size:20px}
.ptab th.dark{color:var(--ink)}
.ptab td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptab .weak{color:#9B2C2F;font-size:14px}
.pnote{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 0 var(--well);margin-bottom:18px;font-size:16px;line-height:1.5}
.pnote h3{font-family:var(--display);margin:0 0 6px;font-size:22px}
.danger{border:0;border-radius:14px;padding:12px 18px;background:#FBD9D8;color:#9B2C2F;min-height:48px}

/* games (Akıl Bahçesi) */
.mgrid{display:grid;gap:8px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:3/4;border:0;padding:0;background:none;perspective:700px}
.mcard .in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 rgba(30,58,74,.18)}
.cback{background:var(--coral);background-image:radial-gradient(rgba(255,255,255,.35) 2px, transparent 2.5px);background-size:12px 12px}
.front{background:var(--card);transform:rotateY(180deg)}
.mcard.done .front{background:#DDF5E7;animation:pop .35s}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--card);border-radius:20px;padding:16px 10px;box-shadow:0 4px 0 var(--well)}
.gtile{width:50px;height:50px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:28px;animation:rise .3s both}
.gtile.num{font-family:var(--display);font-size:24px;color:var(--ink);width:auto;min-width:50px;padding:0 6px}
.gtile.q{background:var(--grape);color:#fff;font-family:var(--display);font-size:28px;animation:rise .3s both, pulse 1.2s .4s infinite}
.gtile.q.ok{background:var(--ok);animation:pop .35s} .gtile.q.no{background:var(--no);animation:shake .4s}
.opts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px}
.opt{width:80px;height:80px;border:0;border-radius:20px;background:var(--card);font-size:40px;box-shadow:0 5px 0 var(--well)}
.opt.num{font-family:var(--display);font-size:30px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--well)}
.opt.ok{background:var(--ok);color:#fff} .opt.no{background:var(--no);color:#fff;animation:shake .4s}
.sboard{display:grid;max-width:440px;margin:0 auto;background:var(--ink);border:4px solid var(--ink);border-radius:16px;overflow:hidden;gap:2px}
.cell{aspect-ratio:1;border:0;background:var(--card);display:grid;place-items:center;padding:0}
.cell.given{background:#EEF6F1}
.cell.br{margin-right:3px} .cell.bb{margin-bottom:3px}
.cell.sel{background:#FFF1C9;box-shadow:inset 0 0 0 3px var(--sun)}
.cell.bad{background:#FFE0DF;animation:shake .35s}
.palette{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
.pal{width:62px;height:62px;border:0;border-radius:16px;background:var(--card);font-size:32px;box-shadow:0 4px 0 var(--well)}
.pal:active{transform:translateY(3px);box-shadow:0 1px 0 var(--well)}
.pal.erase{font-size:22px;color:var(--muted)}
.slide{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;background:var(--well);border-radius:20px;padding:0}
.stl{position:absolute;border:0;background:none;padding:5px;transition:left .14s ease-out, top .14s ease-out}
.stl span{display:grid;place-items:center;width:100%;height:100%;border-radius:14px;background:var(--sky);color:#fff;
  font-family:var(--display);font-size:clamp(26px,8vw,46px);box-shadow:0 5px 0 rgba(30,58,74,.25)}
.stl.home span{background:var(--leaf)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:380px;margin:0 auto}
.pad{aspect-ratio:1;border:0;border-radius:28px;box-shadow:0 6px 0 rgba(30,58,74,.25);filter:saturate(.75) brightness(.92);transition:filter .1s, transform .1s}
.pad.lit{filter:saturate(1.2) brightness(1.25);transform:scale(1.05)}
.pads.watch .pad{cursor:default}
.big{display:block;margin:22px auto 0;border:0;border-radius:999px;padding:12px 30px;background:var(--ink);color:#fff;font-family:var(--display);font-size:22px;box-shadow:0 5px 0 rgba(30,58,74,.3)}

/* yeni zeka oyunları */
/* maze */
.maze{display:block;margin:0 auto;touch-action:none;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--well);max-width:100%}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:12px}

/* robot */
.kgrid{display:grid;gap:4px;max-width:420px;margin:0 auto;background:var(--well);padding:6px;border-radius:18px}
.kc{aspect-ratio:1;background:var(--card);border-radius:10px;display:grid;place-items:center;line-height:1}
.kc.trail{background:#FFF1C9}
.kc.hit{background:#FFE0DF;animation:shake .4s}
.kc .got{opacity:.25}
.kprog{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:60px;background:var(--card);border-radius:16px;padding:8px;margin:14px auto 0;max-width:420px;box-shadow:0 4px 0 var(--well)}
.kprog .empty{color:var(--muted);font-size:14px;padding:0 6px}
.kblk{border:0;border-radius:12px;background:var(--sky);color:#fff;font-family:var(--display);font-size:24px;min-width:46px;height:44px;padding:0 8px;line-height:1}
.kblk small{font-size:15px;margin-left:2px}
.kblk.cur{background:var(--sun);color:var(--ink)}
.ctrls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.cbtn{width:62px;height:62px;border:0;border-radius:16px;background:var(--card);font-family:var(--display);font-size:30px;box-shadow:0 4px 0 var(--well);line-height:1}
.cbtn.rep{font-size:22px;color:var(--grape)}
.cbtn.on{background:var(--grape);color:#fff}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--well)}
.cbtn:disabled{opacity:.4}
.krun{background:var(--leaf);color:#fff;width:auto;padding:0 22px;font-size:22px}

/* scale */
.scales{display:grid;gap:12px;max-width:520px;margin:0 auto}
.scale{background:var(--card);border-radius:18px;padding:12px 12px 10px;box-shadow:0 4px 0 var(--well)}
.scale.q{box-shadow:0 0 0 3px var(--grape),0 4px 0 var(--well)}
.beam{display:flex;align-items:flex-end;gap:8px}
.pan{flex:1;min-width:0;min-height:52px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;font-size:clamp(22px,6vw,30px);line-height:1.1;border-bottom:5px solid var(--ink);border-radius:0 0 40% 40%;padding:0 8px 6px}
.pan .qm{font-family:var(--display);color:var(--grape);font-size:30px}
.fulcrum{flex:none;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:24px solid var(--ink);margin-bottom:-5px}
.eq{text-align:center;font-family:var(--display);color:var(--muted);font-size:14px;margin-top:4px}
.opt.wide{width:auto;min-width:100px;padding:0 14px;font-size:28px;font-family:var(--display)}
.tip{max-width:520px;margin:14px auto 0;background:#FFF1C9;border-radius:14px;padding:10px 14px;text-align:center;font-size:15px}

/* hanoi */
.hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:600px;margin:0 auto}
.peg{position:relative;border:0;background:var(--card);border-radius:18px;display:flex;flex-direction:column-reverse;align-items:center;padding:10px 4px 16px;box-shadow:0 4px 0 var(--well)}
.peg::before{content:"";position:absolute;bottom:16px;top:34px;left:50%;width:8px;margin-left:-4px;background:var(--well);border-radius:4px}
.peg.target{background:#E4F7EC}
.peg.sel{box-shadow:0 0 0 3px var(--sun),0 4px 0 var(--well)}
.peg .flag{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:18px}
.ring{position:relative;height:26px;border-radius:13px;margin-top:4px;transition:transform .15s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.ring.up{transform:translateY(-18px)}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(30,58,74,.45);display:grid;place-items:center;overflow-y:auto;padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mbox{background:var(--card);border-radius:28px;padding:24px 22px;width:100%;max-width:440px;text-align:center;animation:pop .35s}
.mbox h3{font-family:var(--display);font-size:32px;margin:4px 0;line-height:1.1}
.mbox p{color:var(--muted);margin:0 0 16px}
.mbox .intro{text-align:left;color:var(--ink);font-size:18px;line-height:1.5}
.mbox .intro .vis{margin:10px 0}
.mstars{font-size:52px;letter-spacing:4px;line-height:1}
.mstars i{font-style:normal;color:var(--well);display:inline-block}
.mstars i.on{color:var(--sun);animation:pop .4s both}
.mbtns{display:grid;gap:10px}
.mb{border:0;border-radius:16px;padding:12px;font-family:var(--display);font-size:20px;background:var(--bg);min-height:52px}
.mb.main{background:var(--leaf);color:#fff;box-shadow:0 4px 0 rgba(30,58,74,.25)}
.brk{background:#E3F0FC;border-radius:14px;padding:10px;color:var(--ink)!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (min-width:700px){
  .qtext{font-size:23px}
  .ch{font-size:22px}
}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ================= yardımcılar ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const rnd=n=>Math.floor(Math.random()*n);
const ri=(a,b)=>a+rnd(b-a+1);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* Türkçe sayı ekleri: ek(45,'abl') -> 45'ten */
const ONES=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'],TENS=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
function lastWord(n){n=Math.abs(n);if(n===0)return 'sıfır';if(n%10)return ONES[n%10];if(n%100)return TENS[(n%100)/10];if(n%1000)return 'yüz';return 'bin'}
const VW='aeıioöuü';
function ek(n,k){
  const w=lastWord(n),lv=[...w].reverse().find(c=>VW.includes(c)),back='aıou'.includes(lv),last=w[w.length-1],ev=VW.includes(last),hard='çfhkpsşt'.includes(last);
  const i4='ei'.includes(lv)?'i':'aı'.includes(lv)?'ı':'ou'.includes(lv)?'u':'ü';
  const s={abl:(hard?'t':'d')+(back?'an':'en'),loc:(hard?'t':'d')+(back?'a':'e'),dat:(ev?'y':'')+(back?'a':'e'),acc:(ev?'y':'')+i4,gen:(ev?'n':'')+i4+'n'}[k];
  return n+"'"+s;
}
const DIST=['','birer','ikişer','üçer','dörder','beşer','altışar','yedişer','sekizer','dokuzar','onar'];

/* ================= kayıt ================= */
const KEY='ders-bahcesi-v1';
let save={level:{},stars:{},stats:{},review:{},seen:{},muted:false,voice:true,day:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.level)save=Object.assign(save,s)}catch(e){}
try{ // Akıl Bahçesi'nden gelen ilerlemeyi bir kez taşı
  if(!save.migrated){const o=JSON.parse(localStorage.getItem('akil-bahcesi-v1')||'null');
    if(o&&o.level){for(const k in o.level)save.level[k]=Math.max(save.level[k]||1,o.level[k]);for(const k in o.stars||{})save.stars[k]=Object.assign({},o.stars[k],save.stars[k]||{})}
    save.migrated=true}
}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const lvl=id=>save.level[id]||1;
const actStars=id=>Object.values(save.stars[id]||{}).reduce((a,b)=>a+b,0);
function day(){if(!save.day||save.day.d!==today())save.day={d:today(),rounds:0,stars:0,qs:0};return save.day}

/* ================= efekt sesleri ================= */
let actx=null;
function tone(f,dur=.15,type='sine',vol=.15,when=0){
  if(save.muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sfx={
  tap:()=>tone(540,.08,'triangle',.08),
  good:()=>{tone(660,.12,'sine',.14);tone(880,.16,'sine',.14,.1)},
  bad:()=>tone(190,.25,'sawtooth',.05),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.14,i*.12)),
};

/* ================= sesli okuma ================= */
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const VOICES={tr:null,en:null};
function pickVoices(){
  if(!TTS)return;
  try{
    const vs=speechSynthesis.getVoices()||[];
    const best=re=>{const c=vs.filter(v=>re.test((v.lang||'').replace('_','-')));
      return c.find(v=>/enhanced|premium|geliştirilmiş/i.test(v.name))||c.find(v=>v.localService)||c[0]||null};
    VOICES.tr=best(/^tr(-|$)/i);VOICES.en=best(/^en-US/i)||best(/^en-GB/i)||best(/^en/i);
  }catch(e){}
}
if(TTS){pickVoices();try{speechSynthesis.addEventListener('voiceschanged',pickVoices)}catch(e){speechSynthesis.onvoiceschanged=pickVoices}}
function cleanTR(t){
  return String(t).replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ')
    .replace(/×/g,' kere ').replace(/÷/g,' bölü ').replace(/ [−-] /g,' eksi ').replace(/ \+ /g,' artı ').replace(/ = /g,' eşittir ')
    .replace(/_{2,}|⬜|…/g,' ... ')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}★₺]/gu,' ')
    .replace(/\s+/g,' ').trim();
}
const cleanEN=t=>String(t).replace(/<[^>]+>/g,' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,' ').replace(/\s+/g,' ').trim();
/* segs: "metin" ya da [["metin","tr"],["apple","en"]] ; force: otomatik okuma kapalıyken de oku (hoparlör düğmesi) */
function speak(segs,force){
  if(!TTS||(!save.voice&&!force))return;
  if(typeof segs==='string')segs=[[segs,'tr']];
  try{
    speechSynthesis.cancel();
    segs.forEach(([txt,lang])=>{
      const t=lang==='en'?cleanEN(txt):cleanTR(txt);if(!t)return;
      const u=new SpeechSynthesisUtterance(t);
      u.lang=lang==='en'?'en-US':'tr-TR';const v=VOICES[lang==='en'?'en':'tr'];if(v)u.voice=v;
      u.rate=lang==='en'?.82:.92;u.pitch=1.05;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function hush(){try{if(TTS)speechSynthesis.cancel()}catch(e){}}
let ttsUnlocked=false;
document.addEventListener('pointerdown',()=>{ // iPad Safari: ilk dokunuşta sesi aç
  if(ttsUnlocked||!TTS)return;ttsUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
},{capture:true});

function syncTools(){
  $$('.mute').forEach(b=>{b.textContent=save.muted?'🔇':'🔊';b.classList.toggle('off',save.muted)});
  $$('.voice').forEach(b=>{b.hidden=!TTS;b.textContent=save.voice?'🗣️':'🤐';b.classList.toggle('off',!save.voice)});
  $$('.say').forEach(b=>b.hidden=!TTS);
}
$$('.mute').forEach(b=>b.onclick=()=>{save.muted=!save.muted;persist();syncTools();sfx.tap()});
$$('.voice').forEach(b=>b.onclick=()=>{save.voice=!save.voice;persist();syncTools();if(save.voice)speak('Sesli okuma açık.');else hush()});
function sayBtn(segs,cls){const b=el('button','say'+(cls?' '+cls:''),'🔊');b.setAttribute('aria-label','Dinle');b.hidden=!TTS;b.onclick=()=>speak(typeof segs==='function'?segs():segs,true);return b}

/* ================= akış ================= */
let gen=0,cur=null,curSubject=null;
const later=(fn,ms)=>{const g=gen;setTimeout(()=>{if(g===gen)fn()},ms)};
const status=t=>{$('#status').textContent=t};
const sessionStart=Date.now();let breakShown=false;
const SCREENS=['home','subject','play','parent'];
function show(id){gen++;hush();closeModal();SCREENS.forEach(s=>$('#'+s).hidden=s!==id);scrollTo(0,0)}

function renderHome(){
  show('home');
  const total=ACTS.reduce((a,x)=>a+actStars(x.id),0);$('#total').textContent=total;
  const d=day(),goal=3;
  $('#today').innerHTML=`<span class="ti">${d.rounds>=goal?'🏆':'🌱'}</span><span class="tt"><b>${d.rounds>=goal?'Bugünkü hedef tamam!':'Bugünkü hedef: 3 etkinlik'}</b><small>Bugün ${d.rounds} etkinlik, ${d.stars} yıldız</small></span><span class="goal">${[0,1,2].map(i=>`<i class="${i<d.rounds?'on':''}">${i<d.rounds?'✓':''}</i>`).join('')}</span>`;
  const list=$('#subjects');list.innerHTML='';
  SUBJECTS.forEach(s=>{
    const acts=ACTS.filter(a=>a.s===s.id),st=acts.reduce((a,x)=>a+actStars(x.id),0);
    const b=el('button','gcard'+(s.dark?' dark':''));b.style.setProperty('--c',s.color);
    b.innerHTML=`<span class="gicon">${s.icon}</span><span class="gtext"><span class="gname">${s.name}</span><span class="gdesc">${s.desc}</span></span><span class="gmeta"><span class="lvl">${acts.length} konu</span><span class="gst">★ ${st}</span></span>`;
    b.onclick=()=>{sfx.tap();openSubject(s.id)};
    list.append(b);
  });
  syncTools();
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx'),ctx=cv.getContext('2d'),d=devicePixelRatio||1;
  const W=cv.width=innerWidth*d,H=cv.height=innerHeight*d;
  const cs=['#FF6B57','#FFC23C','#22A866','#3399E6','#8A5CD6'];
  const ps=[...Array(130)].map(()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*W*.035,vy:-Math.random()*H*.028-H*.006,s:(5+Math.random()*7)*d,c:cs[rnd(5)],r:Math.random()*6}));
  let t=0;(function f(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*.0009;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++t<120)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H);
  })();
}

/* ================= soru turu ================= */
const qkey=q=>q.k||(q.t+'|'+(q.passage?q.passage.title+'|':'')+String(q.q).replace(/<[^>]+>/g,'')+'|'+JSON.stringify(q.ans??q.target??''));
function buildRound(a,L){
  let list;
  if(a.round)list=a.round(L);
  else{
    list=[];const seen=new Set();
    for(let tries=0;list.length<(a.n||6)&&tries<80;tries++){const q=a.gen(L);const k=qkey(q);if(seen.has(k)&&tries<60)continue;seen.add(k);list.push(q)}
  }
  const rev=(save.review[a.id]||[]).filter(r=>!list.some(q=>qkey(q)===r.k)).slice(0,2);
  if(rev.length){
    const keep=list.slice(0,Math.max(list.length-rev.length,3));
    list=a.round?keep.concat(rev.map(r=>Object.assign({},r.q,{_rev:1}))):shuffle(keep.concat(rev.map(r=>Object.assign({},r.q,{_rev:1}))));
  }
  return list;
}
function addReview(id,q){
  const k=qkey(q),r=(save.review[id]=save.review[id]||[]).filter(x=>x.k!==k);
  const c=Object.assign({},q);delete c._rev;delete c._again;
  r.unshift({k,q:c});save.review[id]=r.slice(0,8);
}
function dropReview(id,q){const k=qkey(q);if(save.review[id])save.review[id]=save.review[id].filter(x=>x.k!==k)}
function stat(id,ok){const s=save.stats[id]=save.stats[id]||{ok:0,bad:0};ok?s.ok++:s.bad++;day().qs++}

function qSegs(q){return q.sp||[[q.say||q.q,'tr']]}
function runQuiz(stage,a,L,speakFirst=true){
  const list=buildRound(a,L);
  let i=0,mistakes=0,lastPassage=null;
  const dots=el('div','dots'),body=el('div');
  stage.append(dots,body);
  function drawDots(){dots.innerHTML='';list.forEach((q,k)=>dots.append(el('span','dot'+(k<i?(q._res==='ok'?' ok':' no'):k===i?' now':''))))}
  function showQ(autoSpeak){
    const q=list[i];drawDots();body.innerHTML='';
    let tries=0,done=false;
    const segs=qSegs(q);
    let pre=[];
    if(q.passage){
      const p=el('div','passage');const h=el('h3',null,q.passage.title);
      const ps=[[q.passage.title+'. '+q.passage.text,'tr']];
      h.prepend(sayBtn(ps,'sm'));p.append(h,el('p',null,q.passage.text));body.append(p);
      if(lastPassage!==q.passage.title){pre=ps;lastPassage=q.passage.title}
    }
    const qc=el('div','qcard');qc.append(sayBtn(segs),el('div','qtext',q.q));body.append(qc);
    if(q.vis)body.append(el('div','vis',q.vis));
    const wbox=el('div','wbox');body.append(wbox);
    const fb=el('div','fb');fb.hidden=true;body.append(fb);
    const ctl={submit(ok){
      if(done)return;
      if(ok){
        done=true;w.lock&&w.lock();sfx.good();
        q._res=tries?'help':'ok';stat(a.id,!tries);
        if(!tries&&q._rev)dropReview(a.id,q);
        if(tries)addReview(a.id,q);
        persist();
        const p=pick(['Doğru!','Aferin!','Harika!','Süper!','Bravo!','Çok iyi!']);
        fb.className='fb good';fb.innerHTML=`<span class="fi">${tries?'👍':'🌟'}</span><span>${p}</span>`;fb.hidden=false;
        const ex=q.after?[[p,'tr'],...q.after]:[[p,'tr']];speak(ex);
        later(next,q.after?1900:1100);
      }else{
        tries++;mistakes++;sfx.bad();
        if(tries===1){
          w.retry&&w.retry();
          fb.className='fb hint';fb.innerHTML=`<span class="fi">💡</span><span class="ft">${q.hint||'Bir daha düşün. Sen yaparsın!'}</span>`;fb.hidden=false;
          speak('İpucu: '+(q.hint||'Bir daha düşün.'));
        }else{
          done=true;w.reveal&&w.reveal();
          q._res='no';stat(a.id,false);addReview(a.id,q);persist();
          if(!q._again&&list.filter(x=>x._again).length<2)list.push(Object.assign({},q,{_again:1,_res:null}));
          fb.className='fb exp';fb.innerHTML=`<span class="fi">📘</span><span class="ft">${q.exp||'Doğru cevabı yeşil ile gösterdim.'}</span>`;
          const g=el('button','go','Devam ▶');g.onclick=()=>{sfx.tap();next()};fb.append(g);fb.hidden=false;
          speak([[q.exp||'Doğru cevabı yeşil ile gösterdim.','tr'],...(q.after||[])]);
          drawDots();
        }
      }
    }};
    const w=W[q.t](wbox,q,ctl)||{};
    window.__db={q,ctl,w};
    cur.speakQ=()=>speak(segs);
    if(autoSpeak)speak(pre.concat(segs));
  }
  function next(){
    i++;
    if(i<list.length){showQ(true);scrollTo({top:0,behavior:'smooth'});return}
    drawDots();
    const stars=mistakes===0?3:mistakes<=2?2:1,max=a.max||99;
    endRound(stars,{leveled:stars>=2,next:stars>=2&&cur.L<max,msg:stars>=2?(cur.L>=max?'Bu konunun son seviyesini bitirdin! İstersen tekrar oynayabilirsin.':`Seviye ${cur.L} tamamlandı.`):null});
  }
  showQ(speakFirst);
}

function MC(q,ans,wrongs,o={}){
  const ch=shuffle(uniq([ans,...wrongs].map(String)).slice(0,o.n||4));
  return Object.assign({t:'mc',q,ch,ans:String(ans)},o);
}
function numWrongs(ans,cands,n=3){
  const s=new Set();for(const c of shuffle(cands))if(s.size<n&&c>=0&&c!==ans)s.add(c);
  for(let k=1;s.size<n;k++){if(!s.has(ans+k))s.add(ans+k);if(s.size<n&&ans-k>=0&&!s.has(ans-k))s.add(ans-k)}
  return [...s];
}

function fromBank(it){
  return MC(it.q,it.a,it.w,{vis:it.v,hint:it.h,exp:it.e||`Doğru cevap: <b>${it.a}</b>.${it.x?' '+it.x:''}`,sp:it.sp,cls:it.cls,after:it.en?[[it.en,'en']]:null,n:it.n});
}
function bankRound(items,L,n=6){
  const pool=items.filter(x=>(x.l||1)<=L);
  const fresh=shuffle(pool.filter(x=>(x.l||1)===L)),old=shuffle(pool.filter(x=>(x.l||1)<L));
  const take=uniq([...fresh.slice(0,Math.ceil(n*.6)),...old,...fresh]).slice(0,n);
  while(take.length<n)take.push(pick(pool));
  return shuffle(take).map(it=>typeof it==='function'?it():fromBank(it));
}

function robotLevel(L){
  const N=[0,4,5,5,6,6][L],nr=[0,0,2,4,6,8][L];
  for(let k=0;k<300;k++){
    const start=[rnd(N),rnd(N)],goal=[rnd(N),rnd(N)];
    const dist=Math.abs(start[0]-goal[0])+Math.abs(start[1]-goal[1]);if(dist<[0,2,3,4,5,6][L]||dist>[0,4,6,7,9,10][L])continue;
    const rocks=[];while(rocks.length<nr){const r=[rnd(N),rnd(N)];if((r[0]!==start[0]||r[1]!==start[1])&&(r[0]!==goal[0]||r[1]!==goal[1])&&!rocks.some(x=>x[0]===r[0]&&x[1]===r[1]))rocks.push(r)}
    const prev={},key=p=>p[0]*N+p[1],Q=[start];prev[key(start)]=null;
    while(Q.length){const p=Q.shift();if(p[0]===goal[0]&&p[1]===goal[1])break;
      for(const d of 'URDL'){const [dr,dc]=DIRS[d],n=[p[0]+dr,p[1]+dc];if(n[0]<0||n[1]<0||n[0]>=N||n[1]>=N||rocks.some(x=>x[0]===n[0]&&x[1]===n[1])||key(n) in prev)continue;prev[key(n)]=[p,d];Q.push(n)}}
    if(!(key(goal) in prev))continue;
    const sol=[];let c=goal;while(prev[key(c)]){sol.unshift(prev[key(c)][1]);c=prev[key(c)][0]}
    if(L>=3&&sol.length<=dist&&nr&&rnd(2))continue;
    return {N,start,goal,rocks,sol};
  }
  return robotLevel(Math.max(1,L-1));

/* ---------- 2. Sıradaki Ne? ---------- */
const ITEMS=['🍎','🍌','🍇','⭐','🌙','☀️','💎','🐟','🌸','🍀','🎈','🚗'];
function genQ(L){
  const T=['AB','ABC','n+1'];
  if(L>=2)T.push('AAB','ABB','n+2');
  if(L>=3)T.push('n+5','n+10','AABB','n-1');
  if(L>=4)T.push('ABCD','n+3','n-2','ABAC');
  if(L>=5)T.push('grow','n+4','n-5','AABC');
  if(L>=6)T.push('double','n-3','grow','ABCCB');
  const t=T[rnd(T.length)],n=L<3?3:4;
  if(t[0]==='n'||t==='grow'||t==='double'){
    const seq=[];
    if(t==='grow'){let v=rnd(5)+1,d=1;for(let i=0;i<6;i++){seq.push(v);v+=d;d++}}
    else if(t==='double'){let v=rnd(3)+1;for(let i=0;i<6;i++){seq.push(v);v*=2}}
    else{const d=parseInt(t.slice(1));const s=d>0?rnd(10)+1:Math.abs(d)*5+rnd(10);for(let i=0;i<6;i++)seq.push(s+d*i)}
    const ans=seq.pop(),step=seq[4]-seq[3],opts=new Set([ans]);
    for(const c of shuffle([ans+1,ans-1,ans+step,ans-step,ans+2,ans+10,ans-10,seq[4]]))if(opts.size<n&&c>=0)opts.add(c);
    for(let k=3;opts.size<n;k++)opts.add(ans+k);
    return {seq,ans,opts:shuffle([...opts]),num:true};
  }
  const sym=shuffle(ITEMS).slice(0,5),unit=[...t].map(ch=>sym[ch.charCodeAt(0)-65]);
  const len=Math.min(unit.length*2+rnd(unit.length),9),seq=[];
  for(let i=0;i<=len;i++)seq.push(unit[i%unit.length]);
  const ans=seq.pop(),opts=new Set([ans]);
  for(const s of [...shuffle([...new Set(unit)]),...shuffle(ITEMS)])if(opts.size<n)opts.add(s);
  return {seq,ans,opts:shuffle([...opts])};
}
RUN.pattern=(stage,L,api)=>{
  const total=5;let qi=0,correct=0;
  const dots=el('div','dots');for(let i=0;i<total;i++)dots.append(el('span','dot'));
  const seqBox=el('div','seq'),optBox=el('div','opts');
  stage.append(el('p','hint','Diziye dikkatle bak. Soru işaretinin yerine hangisi gelmeli?'),dots,seqBox,optBox);
  function show(){
    const q=genQ(L);seqBox.innerHTML='';optBox.innerHTML='';
    q.seq.forEach((s,i)=>{const t=el('span','gtile'+(q.num?' num':''),s);t.style.animationDelay=i*60+'ms';seqBox.append(t)});
    const qm=el('span','gtile q','?');qm.style.animationDelay=q.seq.length*60+'ms';seqBox.append(qm);
    dots.children[qi].className='dot now';
    let done=false;
    q.opts.forEach(o=>{
      const b=el('button','opt'+(q.num?' num':''),o);b._v=o;
      b.onclick=()=>{
        if(done)return;done=true;const ok=o===q.ans;
        qm.textContent=q.ans;qm.classList.add(ok?'ok':'no');b.classList.add(ok?'ok':'no');
        if(!ok)[...optBox.children].find(x=>x._v===q.ans)?.classList.add('ok');
        dots.children[qi].className='dot '+(ok?'ok':'no');
        if(ok){correct++;sfx.good()}else sfx.bad();
        qi++;later(()=>qi<total?show():finish(),ok?900:1700);
      };
      optBox.append(b);
    });
    api.status(`Soru ${qi+1} / ${total}`);
  }
  function finish(){
    if(correct>=3)api.win(correct===5?3:correct===4?2:1);
    else api.lose(`${total} sorudan ${correct} tanesini bildin. 3 doğru yaparsan seviyeyi geçersin.`);
  }
  show();
};

/* ---------- 3. Meyve Sudoku ---------- */
const FRUITS=['🍎','🍌','🍇','🍊','🥝','🍓'];
RUN.sudoku=(stage,L,api)=>{
  const big=L>=6,N=big?6:4,br=2,bc=big?3:2;
  const blanks=big?Math.min(12+(L-6)*2,22):3+L;
  const base=(r,c)=>(bc*(r%br)+Math.floor(r/br)+c)%N;
  const rows=shuffle([...Array(N/br).keys()]).flatMap(b=>shuffle([...Array(br).keys()]).map(i=>b*br+i));
  const colsO=shuffle([...Array(N/bc).keys()]).flatMap(s=>shuffle([...Array(bc).keys()]).map(i=>s*bc+i));
  const perm=shuffle([...Array(N).keys()]);
  const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push({r,c,v:perm[base(rows[r],colsO[c])],given:true});
  shuffle(cells).slice(0,blanks).forEach(x=>{x.v=null;x.given=false});
  const sym=FRUITS.slice(0,N);
  let sel=null,mistakes=0,finished=false;
  const board=el('div','sboard');board.style.gridTemplateColumns=`repeat(${N},1fr)`;
  board.style.fontSize=big?'clamp(22px,7vw,34px)':'clamp(30px,11vw,48px)';
  cells.forEach(x=>{
    const b=el('button','cell'+(x.given?' given':''));x.btn=b;
    if((x.c+1)%bc===0&&x.c<N-1)b.classList.add('br');
    if((x.r+1)%br===0&&x.r<N-1)b.classList.add('bb');
    b.onclick=()=>{if(x.given||finished)return;sel=x;sfx.tap();render(conflicts())};
    board.append(b);
  });
  const sameBox=(a,b)=>Math.floor(a.r/br)===Math.floor(b.r/br)&&Math.floor(a.c/bc)===Math.floor(b.c/bc);
  function conflicts(){
    const bad=new Set(),f=cells.filter(x=>x.v!=null);
    for(const a of f)for(const b of f)if(a!==b&&a.v===b.v&&(a.r===b.r||a.c===b.c||sameBox(a,b))){bad.add(a);bad.add(b)}
    return bad;
  }
  function render(bad){
    cells.forEach(x=>{x.btn.textContent=x.v==null?'':sym[x.v];x.btn.classList.toggle('sel',x===sel);x.btn.classList.toggle('bad',bad.has(x)&&!x.given)});
    api.status(`Hata: ${mistakes}`);
  }
  function place(v){
    if(!sel||sel.given||finished)return;
    sel.v=v;const bad=conflicts();
    if(v!=null&&bad.has(sel)){mistakes++;sfx.bad()}else sfx.tap();
    if(cells.every(x=>x.v!=null)&&bad.size===0){
      finished=true;sel=null;render(bad);
      later(()=>api.win(mistakes===0?3:mistakes<=2?2:1),400);return;
    }
    if(v!=null&&!bad.has(sel)){
      const i=cells.indexOf(sel);
      sel=cells.slice(i+1).concat(cells.slice(0,i)).find(x=>x.v==null)||sel;
    }
    render(bad);
  }
  const pal=el('div','palette');
  sym.forEach((s,i)=>{const b=el('button','pal',s);b.setAttribute('aria-label','Meyve '+(i+1));b.onclick=()=>place(i);pal.append(b)});
  const er=el('button','pal erase','⌫');er.setAttribute('aria-label','Sil');er.onclick=()=>place(null);pal.append(er);
  stage.append(el('p','hint',`Her satırda, her sütunda ve kalın çizgili her kutuda her meyve bir kez olmalı. Boş kareye dokun, sonra meyveyi seç.`),board,pal);
  sel=cells.find(x=>x.v==null);render(new Set());
};

/* ---------- 4. Kaydır Diz ---------- */
RUN.slide=(stage,L,api)=>{
  const n=L<=4?3:4,shuf=L<=4?[8,14,22,32][L-1]:Math.min(20+(L-5)*12,70),last=n*n-1;
  const solved=()=>board.every((t,i)=>i===last?t===0:t===i+1);
  const nb=e=>{const r=Math.floor(e/n),c=e%n,o=[];if(r>0)o.push(e-n);if(r<n-1)o.push(e+n);if(c>0)o.push(e-1);if(c<n-1)o.push(e+1);return o};
  let board;
  do{
    board=[...Array(n*n)].map((_,i)=>i===last?0:i+1);
    let e=last,prev=-1;
    for(let k=0;k<shuf;k++){const o=nb(e).filter(x=>x!==prev),p=o[rnd(o.length)];board[e]=board[p];board[p]=0;prev=e;e=p}
  }while(solved());
  let moves=0,done=false;
  const box=el('div','slide'),tiles={};
  for(let t=1;t<=last;t++){
    const b=el('button','stl',`<span>${t}</span>`);b.style.width=b.style.height=100/n+'%';
    b.onclick=()=>{
      if(done)return;const i=board.indexOf(t),e=board.indexOf(0);
      if(!nb(e).includes(i)){sfx.bad();return}
      board[e]=t;board[i]=0;moves++;sfx.tap();place();
      if(solved()){done=true;later(()=>api.win(moves<=shuf?3:moves<=shuf*2?2:1),350)}
    };
    tiles[t]=b;box.append(b);
  }
  function place(){
    board.forEach((t,i)=>{if(!t)return;const b=tiles[t];b.style.left=(i%n)*100/n+'%';b.style.top=Math.floor(i/n)*100/n+'%';b.classList.toggle('home',t===i+1)});
    api.status(`Hamle: ${moves}  ·  3 yıldız için en fazla ${shuf}`);
  }
  stage.append(el('p','hint',`Sayıları 1'den ${last}'e kadar sıraya diz, boşluk en sonda kalsın. Boşluğun yanındaki sayıya dokun. Yerine oturan sayı yeşil olur.`),box);
  place();
};

RUN.simon=(stage,L,api)=>{
  const target=2+L,speed=Math.max(330,640-L*30);
  const P=[{c:'var(--coral)',f:330,n:'Kırmızı'},{c:'var(--sun)',f:392,n:'Sarı'},{c:'var(--leaf)',f:494,n:'Yeşil'},{c:'var(--sky)',f:587,n:'Mavi'}];
  const pads=el('div','pads watch');
  let seq=[],idx=0,input=false,mistakes=0;
  const btns=P.map((p,i)=>{const b=el('button','pad');b.style.background=p.c;b.setAttribute('aria-label',p.n);b.onclick=()=>press(i);pads.append(b);return b});
  function flash(i,ms){btns[i].classList.add('lit');tone(P[i].f,ms/1000*.9,'triangle',.18);later(()=>btns[i].classList.remove('lit'),ms*.75)}
  function play(){
    input=false;idx=0;pads.classList.add('watch');api.status(`İzle… (${seq.length} / ${target})`);
    seq.forEach((v,k)=>later(()=>flash(v,speed),600+k*speed));
    later(()=>{input=true;pads.classList.remove('watch');api.status(`Şimdi sen! (${seq.length} / ${target})`)},600+seq.length*speed);
  }
  function press(i){
    if(!input)return;flash(i,260);
    if(i===seq[idx]){
      idx++;if(idx<seq.length)return;input=false;
      if(seq.length>=target)later(()=>api.win(mistakes===0?3:mistakes===1?2:1),400);
      else{api.status('Aferin!');later(()=>{seq.push(rnd(4));play()},800)}
    }else{
      input=false;mistakes++;sfx.bad();
      if(mistakes>=3)later(()=>api.lose('Üç kez karıştı. Bir daha dene, renkleri içinden sayarak izle!'),500);
      else{api.status(`Olmadı, bir daha izle. Kalan hak: ${3-mistakes}`);later(play,1300)}
    }
  }
  const go=el('button','big','Başla ▶');
  go.onclick=()=>{go.remove();const start=Math.max(1,target-5);seq=[...Array(start)].map(()=>rnd(4));play()};
  stage.append(el('p','hint',`Renklerin yandığı sırayı aklında tut, sonra aynı sırayla bas. Hedef: ${target} renk.`),pads,go);
  api.status('Hazır olunca Başla\'ya dokun.');
};


/* ---------- 6. Labirent ---------- */
RUN.maze=(stage,L,api)=>{
  const N=Math.min(4+L,14),hasKey=L>=4,P=8;
  const DIRS=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]];
  const W=new Array(N*N).fill(15),seen=new Array(N*N).fill(false),st=[0];seen[0]=true;
  while(st.length){
    const c=st[st.length-1],x=c%N,y=(c/N)|0;
    const o=DIRS.filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>=0&&ny>=0&&nx<N&&ny<N&&!seen[ny*N+nx]});
    if(!o.length){st.pop();continue}
    const [dx,dy,b,ob]=o[rnd(o.length)],n=(y+dy)*N+x+dx;W[c]&=~b;W[n]&=~ob;seen[n]=true;st.push(n);
  }
  const open=(a,b)=>{const ax=a%N,ay=(a/N)|0;for(const [dx,dy,bit] of DIRS)if((ay+dy)*N+ax+dx===b&&ax+dx>=0&&ax+dx<N)return !(W[a]&bit);return false};
  const bfs=s=>{const d=new Array(N*N).fill(-1);d[s]=0;const q=[s];while(q.length){const c=q.shift(),x=c%N,y=(c/N)|0;for(const [dx,dy,bit] of DIRS){if(W[c]&bit)continue;const n=(y+dy)*N+x+dx;if(d[n]<0){d[n]=d[c]+1;q.push(n)}}}return d};
  const START=0,EXIT=N*N-1,d0=bfs(START),dE=bfs(EXIT);
  let KEY=-1,sol=d0[EXIT];
  if(hasKey){
    const cand=[...Array(N*N).keys()].filter(c=>c!==START&&c!==EXIT).sort((a,b)=>(d0[b]+dE[b])-(d0[a]+dE[a]));
    KEY=cand[rnd(Math.max(1,Math.ceil(cand.length/4)))];sol=d0[KEY]+dE[KEY];
  }
  const cv=el('canvas','maze'),ctx=cv.getContext('2d');
  let msg='',w=300,S=30,path=[START],done=[],gotKey=!hasKey,drawing=false,back=0,last=null,fin=false;
  function size(){
    w=Math.min(stage.clientWidth||320,600,Math.max(280,innerHeight-260));
    const d=devicePixelRatio||1;cv.style.width=cv.style.height=w+'px';cv.width=cv.height=Math.round(w*d);
    ctx.setTransform(d,0,0,d,0,0);S=(w-2*P)/N;draw();
  }
  const ctr=c=>[P+(c%N+.5)*S,P+(((c/N)|0)+.5)*S];
  function line(cells,color,wd){
    if(cells.length<2)return;ctx.strokeStyle=color;ctx.lineWidth=wd;ctx.lineCap=ctx.lineJoin='round';ctx.beginPath();
    cells.forEach((c,i)=>{const [x,y]=ctr(c);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  }
  function emo(e,c,k=.72){const [x,y]=ctr(c);ctx.font=`${S*k}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y+S*.04)}
  function draw(){
    ctx.clearRect(0,0,w,w);
    ctx.fillStyle='#E4F7EC';ctx.fillRect(P+(EXIT%N)*S,P+((EXIT/N)|0)*S,S,S);
    line(done,'rgba(255,107,87,.35)',S*.34);line(path,'#FF6B57',S*.34);
    ctx.strokeStyle='#1E3A4A';ctx.lineWidth=Math.max(2.5,S*.09);ctx.lineCap='round';ctx.beginPath();
    for(let c=0;c<N*N;c++){
      const x=P+(c%N)*S,y=P+((c/N)|0)*S;
      if(W[c]&1){ctx.moveTo(x,y);ctx.lineTo(x+S,y)} if(W[c]&8){ctx.moveTo(x,y);ctx.lineTo(x,y+S)}
      if(W[c]&2){ctx.moveTo(x+S,y);ctx.lineTo(x+S,y+S)} if(W[c]&4){ctx.moveTo(x,y+S);ctx.lineTo(x+S,y+S)}
    }
    ctx.stroke();
    emo('🧀',EXIT);if(!gotKey){emo('🔒',EXIT,.4);emo('🔑',KEY)}
    emo('🐭',path[path.length-1],.8);
  }
  const pt=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
  const cellAt=(x,y)=>{const cx=Math.floor((x-P)/S),cy=Math.floor((y-P)/S);return cx<0||cy<0||cx>=N||cy>=N?-1:cy*N+cx};
  const upd=()=>api.status(fin?'Başardın!':(msg?msg+'  ·  ':'')+`Geri dönüş: ${back}`);
  function stepTo(c){
    const end=path[path.length-1];if(c<0||c===end)return;
    if(path.length>1&&c===path[path.length-2]){path.pop();back++;return}
    if(!path.includes(c)&&open(end,c)){path.push(c);tone(500+path.length*6,.04,'sine',.04);check()}
  }
  function check(){
    const end=path[path.length-1];
    if(!gotKey&&end===KEY){gotKey=true;sfx.good();done=path.slice();path=[KEY];msg='Anahtarı aldın! Şimdi peynire git.'}
    else if(end===EXIT){
      if(!gotKey){msg='Kapı kilitli! Önce 🔑 anahtarı bul.';return}
      fin=true;drawing=false;upd();
      later(()=>api.win(back<=Math.ceil(sol*.25)?3:back<=sol?2:1),400);
    }
  }
  cv.addEventListener('pointerdown',e=>{
    if(fin)return;const p=pt(e),c=cellAt(p.x,p.y),i=path.indexOf(c);
    if(i<0){msg='Çizmeye farenin 🐭 üstünden başla.';upd();return}
    if(i<path.length-1){back+=path.length-1-i;path.length=i+1}
    drawing=true;last=p;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();draw();upd();
  });
  cv.addEventListener('pointermove',e=>{
    if(!drawing||fin)return;const p=pt(e),dx=p.x-last.x,dy=p.y-last.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(S/5)));
    for(let k=1;k<=n&&!fin;k++)stepTo(cellAt(last.x+dx*k/n,last.y+dy*k/n));
    last=p;draw();if(!fin)upd();
  });
  const stop=()=>{drawing=false};
  cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);
  stage.append(el('p','hint',hasKey?'Önce 🔑 anahtarı al, sonra 🧀 peynire git. Kalemle ya da parmağınla fareden başlayıp yol çiz.':'Kalemle ya da parmağınla fareden 🐭 başlayıp peynire 🧀 kadar yol çiz. Duvarlardan geçemezsin.'),cv,
    el('div','legend','<span>Yanlış yola girersen geri çiz</span><span>3 yıldız: az geri dönüş</span>'));
  size();upd();
  RUN.maze.dbg={N,P,get S(){return S},START,EXIT,get KEY(){return KEY},bfs,W,cv};
  const g=gen,onR=()=>{if(g!==gen){removeEventListener('resize',onR);return}size()};addEventListener('resize',onR);
};

/* ---------- 7. Robot Yolu ---------- */
RUN.robot=(stage,L,api)=>{
  const N=L<3?4:L<7?5:6,nStars=L<4?1:L<7?2:3,nRocks=L<2?0:Math.min(L+1,Math.floor(N*N/3)),canRep=L>=5,MAX=14;
  const D={U:[0,-1,'↑'],R:[1,0,'→'],D:[0,1,'↓'],L:[-1,0,'←']};
  let start,stars,rocks,best=null;
  function solve(){
    const full=(1<<nStars)-1,key=(p,m)=>p*8+m,prev=new Map([[key(start,0),null]]),q=[[start,0]];
    while(q.length){
      const [p,m]=q.shift();
      if(m===full){const mv=[];let k=key(p,m);while(prev.get(k)){const [pk,d]=prev.get(k);mv.push(d);k=pk}return mv.reverse()}
      for(const d in D){
        const x=p%N+D[d][0],y=((p/N)|0)+D[d][1];if(x<0||y<0||x>=N||y>=N)continue;
        const np=y*N+x;if(rocks.has(np))continue;const si=stars.indexOf(np),nm=si>=0?m|(1<<si):m,k=key(np,nm);
        if(prev.has(k))continue;prev.set(k,[key(p,m),d]);q.push([np,nm]);
      }
    }
    return null;
  }
  const blocksOf=mv=>{if(!canRep)return mv.length;let b=0;for(let i=0;i<mv.length;){let j=i;while(j<mv.length&&mv[j]===mv[i])j++;b+=Math.ceil((j-i)/4);i=j}return b};
  const minLen=Math.min(2+L,11);
  for(let t=0;t<600;t++){
    const cells=shuffle([...Array(N*N).keys()]);start=cells[0];stars=cells.slice(1,1+nStars);rocks=new Set(cells.slice(1+nStars,1+nStars+nRocks));
    const mv=solve();if(!mv)continue;
    const straight=mv.every(d=>d===mv[0]);
    const ok=L===1?(straight&&mv.length>=2&&mv.length<=3):L===2?(!straight&&mv.length>=3&&mv.length<=5):mv.length>=minLen;
    if(ok||!best)best={start,stars,rocks,mv};
    if(ok)break;
  }
  ({start,stars,rocks}=best);const opt=blocksOf(best.mv);
  let prog=[],mult=1,running=false,pos=start,got=new Set(),trail=new Set(),hit=-1;
  const grid=el('div','kgrid');grid.style.gridTemplateColumns=`repeat(${N},1fr)`;grid.style.fontSize=N>=6?'clamp(22px,6.5vw,36px)':'clamp(26px,8vw,42px)';
  const cells=[...Array(N*N)].map(()=>{const c=el('div','kc');grid.append(c);return c});
  function render(){
    cells.forEach((c,i)=>{
      const si=stars.indexOf(i);
      c.className='kc'+(trail.has(i)?' trail':'')+(i===hit?' hit':'');
      c.innerHTML=i===pos?'🤖':rocks.has(i)?'🌳':si>=0?`<span class="${got.has(si)?'got':''}">⭐</span>`:'';
    });
  }
  const progBox=el('div','kprog');
  function renderProg(cur=-1){
    progBox.innerHTML='';
    if(!prog.length)progBox.append(el('span','empty','Komutların burada dizilecek'));
    prog.forEach((b,i)=>{
      const x=el('button','kblk'+(i===cur?' cur':''),D[b.d][2]+(b.n>1?`<small>×${b.n}</small>`:''));
      x.setAttribute('aria-label','Komutu sil');x.onclick=()=>{if(running)return;prog.splice(i,1);sfx.tap();renderProg()};progBox.append(x);
    });
    api.status(`Komut: ${prog.length}  ·  3 yıldız için en fazla ${opt}`);
  }
  const ctrls=el('div','ctrls'),repRow=el('div','ctrls');
  for(const d of ['L','U','D','R']){
    const b=el('button','cbtn',D[d][2]);b.setAttribute('aria-label','Ok');
    b.onclick=()=>{if(running||prog.length>=MAX)return;sfx.tap();prog.push({d,n:mult});mult=1;syncRep();renderProg()};ctrls.append(b);
  }
  const repBtns=[];
  if(canRep)[2,3,4].forEach(n=>{
    const b=el('button','cbtn rep','×'+n);b.setAttribute('aria-label',n+' kez tekrarla');
    b.onclick=()=>{if(running)return;sfx.tap();mult=mult===n?1:n;syncRep()};repBtns.push([b,n]);repRow.append(b);
  });
  function syncRep(){repBtns.forEach(([b,n])=>b.classList.toggle('on',mult===n))}
  const act=el('div','ctrls');
  const del=el('button','cbtn','⌫');del.setAttribute('aria-label','Son komutu sil');del.onclick=()=>{if(running)return;prog.pop();sfx.tap();renderProg()};
  const go=el('button','cbtn krun','Çalıştır ▶');
  go.onclick=()=>{
    if(running||!prog.length)return;running=true;go.disabled=true;
    const steps=prog.flatMap((b,i)=>Array(b.n).fill([b.d,i]));let i=0;
    const tick=()=>{
      if(i>=steps.length)return fail('Program bitti ama yıldızların hepsi toplanmadı.');
      const [d,bi]=steps[i++];renderProg(bi);
      const x=pos%N+D[d][0],y=((pos/N)|0)+D[d][1];
      if(x<0||y<0||x>=N||y>=N)return fail('Robot tahtanın dışına çıkacaktı!');
      if(rocks.has(y*N+x)){hit=y*N+x;render();return fail('Robot ağaca çarptı!')}
      pos=y*N+x;trail.add(pos);const si=stars.indexOf(pos);
      if(si>=0&&!got.has(si)){got.add(si);sfx.good()}else tone(420,.06,'square',.03);
      render();
      if(got.size===nStars){api.status('Yıldızların hepsi toplandı!');return later(()=>api.win(prog.length<=opt?3:prog.length<=opt+2?2:1),500)}
      later(tick,400);
    };
    trail=new Set([start]);later(tick,250);
  };
  function fail(msg){
    sfx.bad();api.status(msg+' Programı düzelt ve tekrar dene.');
    later(()=>{pos=start;got.clear();trail.clear();hit=-1;running=false;go.disabled=false;render();renderProg()},1600);
  }
  act.append(del,go);
  stage.append(el('p','hint',canRep?'Okları sırayla diz, robot ⭐ yıldızların hepsini toplasın. ×2, ×3, ×4 düğmeleri bir sonraki oku tekrarlar: ×3 ve → demek 3 kez sağa git demek.':'Okları sırayla diz, sonra Çalıştır\'a bas. Robot ⭐ yıldızların hepsini toplasın, 🌳 ağaçlara çarpmasın. Yanlış komuta dokunursan silinir.'),
    grid,progBox,ctrls);
  if(canRep)stage.append(repRow);
  stage.append(act);render();renderProg();
};

/* ---------- 8. Terazi ---------- */
const WITEMS=['🍉','🍍','🥥','🍐','🍎','🍋','🍓','🍒'];
function genScale(L){
  const T=L<=1?['one1']:L===2?['one']:L===3?['chain','one']:L===4?['chain','double']:L===5?['sub','chain','double']:L===6?['sub','sum','double','chain']:['sum','sub','chain3','double'];
  const t=T[rnd(T.length)],[A,B,C,E]=shuffle([0,1,2,3,4,5,6,7]).slice(0,4).sort((a,b)=>a-b).map(i=>WITEMS[i]);
  const R=(x,n)=>Array(n).fill(x);
  let f,q=[A],u,ans,tip;
  if(t==='one1'){const k=2+rnd(2);f=[[[A],R(B,k)]];u=B;ans=k;tip=`Terazide 1 ${A} karşısında kaç ${B} var? Say!`}
  else if(t==='one'){const k=2+rnd(4),m=1+rnd(2);f=[[[A],R(B,k)]];q=R(A,m);u=B;ans=k*m;tip=m>1?`1 ${A} = ${k} ${B}. İki ${A} için ${k} + ${k} yap.`:`Terazide 1 ${A} karşısında kaç ${B} var? Say!`}
  else if(t==='chain'){const k=2+rnd(2),m=2+rnd(3);f=[[[A],R(B,k)],[[B],R(C,m)]];u=C;ans=k*m;tip=`1 ${A} = ${k} ${B}. Her ${B} yerine ${m} ${C} koy: ${R(m,k).join(' + ')}`}
  else if(t==='double'){const h=2+rnd(3);f=[[[B,B],[A]],[[A],R(C,2*h)]];q=[B];u=C;ans=h;tip=`2 ${B} = 1 ${A} = ${2*h} ${C}. Tek ${B} bunun yarısı.`}
  else if(t==='sub'){const m=1+rnd(3),a=2+rnd(4);f=[[[A,B],R(C,a+m)],[[B],R(C,m)]];u=C;ans=a;tip=`${A} ve ${B} birlikte ${a+m} ${C}. ${B} tek başına ${m} ${C}. Çıkar: ${a+m} − ${m}`}
  else if(t==='sum'){const m=2+rnd(3),p=1+rnd(3);f=[[[A],[B,C]],[[B],R(E,m)],[[C],R(E,p)]];u=E;ans=m+p;tip=`${A} = ${B} + ${C}. ${B} = ${m} ${E}, ${C} = ${p} ${E}. Topla!`}
  else{const p=2+rnd(2);f=[[[A],R(B,2)],[[B],R(C,2)],[[C],R(E,p)]];u=E;ans=4*p;tip=`Adım adım git: 1 ${A} = 2 ${B} = 4 ${C}. Her ${C} = ${p} ${E}.`}
  const n=L<3?3:4,o=new Set([ans]);
  for(const c of shuffle([ans+1,ans-1,ans+2,ans-2,ans*2,ans+3]))if(o.size<n&&c>0)o.add(c);
  for(let k=4;o.size<n;k++)o.add(ans+k);
  return {f,q,u,ans,tip,opts:[...o].sort((a,b)=>a-b)};
}
function scaleEl(l,r,cls=''){
  const s=el('div','scale '+cls),b=el('div','beam');
  b.append(el('div','pan',l.join('')),el('div','fulcrum'),el('div','pan',Array.isArray(r)?r.join(''):r));
  s.append(b);return s;
}
RUN.scale=(stage,L,api)=>{
  const total=5;let qi=0,score=0;
  const dots=el('div','dots');for(let i=0;i<total;i++)dots.append(el('span','dot'));
  const box=el('div','scales'),optBox=el('div','opts'),tipBox=el('div','tip');tipBox.hidden=true;
  stage.append(el('p','hint','Üstteki teraziler dengede. Onlara bakarak soru işaretli teraziyi dengele.'),dots,box,optBox,tipBox);
  function show(){
    const q=genScale(L);box.innerHTML='';optBox.innerHTML='';tipBox.hidden=true;
    q.f.forEach(([l,r])=>box.append(scaleEl(l,r)));
    const qs=scaleEl(q.q,`<span class="qm">?</span>&nbsp;${q.u}`,'q');box.append(qs);
    dots.children[qi].className='dot now';
    let tries=0,done=false;
    q.opts.forEach(o=>{
      const b=el('button','opt wide',`${o} <span style="font-size:24px">${q.u}</span>`);
      b.onclick=()=>{
        if(done||b.disabled)return;
        if(o===q.ans){
          done=true;score+=tries?.5:1;b.classList.add('ok');sfx.good();
          qs.querySelectorAll('.pan')[1].innerHTML=Array(q.ans).fill(q.u).join('');
          dots.children[qi].className='dot '+(tries?'now':'ok');if(tries)dots.children[qi].style.background='var(--sun)';
          qi++;later(()=>qi<total?show():finish(),1300);
        }else if(!tries){tries++;b.classList.add('no');b.disabled=true;sfx.bad();tipBox.innerHTML='💡 '+q.tip;tipBox.hidden=false}
        else{
          done=true;b.classList.add('no');sfx.bad();[...optBox.children].find(x=>x.textContent.startsWith(q.ans+' '))?.classList.add('ok');
          qs.querySelectorAll('.pan')[1].innerHTML=Array(q.ans).fill(q.u).join('');
          dots.children[qi].className='dot no';qi++;later(()=>qi<total?show():finish(),2200);
        }
      };
      optBox.append(b);
    });
    api.status(`Soru ${qi+1} / ${total}`);
  }
  function finish(){
    if(score>=3)api.win(score>=5?3:score>=4?2:1);
    else api.lose('Biraz daha pratik yapalım. İpuçlarını dikkatle oku, terazileri adım adım düşün.');
  }
  show();
};

/* ---------- 9. Hanoi Kulesi ---------- */
RUN.hanoi=(stage,L,api)=>{
  const CFG=[[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
  let [n,mixed]=L<=CFG.length?CFG[L-1]:[6,L%2];
  const COL=['#FF6B57','#FFC23C','#22A866','#3399E6','#8A5CD6','#FF9FBF'];
  const optFrom=(pg,t)=>{const pos={};pg.forEach((p,i)=>p.forEach(s=>pos[s]=i));const f=(k,t)=>k===0?0:pos[k]===t?f(k-1,t):f(k-1,3-pos[k]-t)+1+(2**(k-1)-1);return f(n,t)};
  let pegs,target;
  if(!mixed){pegs=[[...Array(n)].map((_,i)=>n-i),[],[]];target=2}
  else{
    target=rnd(3);let t=0;
    do{pegs=[[],[],[]];for(let s=n;s>=1;s--)pegs[rnd(3)].push(s);t++}while(optFrom(pegs,target)<2**(n-1)&&t<300);
  }
  const opt=optFrom(pegs,target);
  let sel=-1,moves=0,fin=false;
  const box=el('div','hanoi'),pegEls=[0,1,2].map(i=>{
    const p=el('button','peg'+(i===target?' target':''));p.setAttribute('aria-label',`${i+1}. direk`);
    p.style.height=(70+n*30)+'px';p.onclick=()=>tap(i);box.append(p);return p;
  });
  function render(){
    pegEls.forEach((p,i)=>{
      p.innerHTML=i===target?'<span class="flag">🏁</span>':'';p.classList.toggle('sel',i===sel);
      pegs[i].forEach((s,j)=>{const r=el('span','ring'+(i===sel&&j===pegs[i].length-1?' up':''));r.style.width=(28+62*s/n)+'%';r.style.background=COL[s-1];p.append(r)});
    });
    api.status(`Hamle: ${moves}  ·  En az: ${opt}`);
  }
  function tap(i){
    if(fin)return;
    if(sel<0){if(!pegs[i].length)return;sel=i;sfx.tap();return render()}
    if(i===sel){sel=-1;return render()}
    const a=pegs[sel],b=pegs[i],s=a[a.length-1];
    if(b.length&&b[b.length-1]<s){sfx.bad();sel=-1;render();api.status('Büyük halka küçüğün üstüne konamaz!');return}
    b.push(a.pop());sel=-1;moves++;tone(300+s*60,.1,'triangle',.12);render();
    if(pegs[target].length===n){fin=true;later(()=>api.win(moves<=opt?3:moves<=Math.ceil(opt*1.5)?2:1),400)}
  }
  stage.append(el('p','hint','Bütün halkaları 🏁 bayraklı direğe taşı. Önce halkanın olduğu direğe, sonra gideceği direğe dokun. Büyük halka küçüğün üstüne konamaz.'),box);
  render();
};

syncTools();renderHome();
